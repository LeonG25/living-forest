  async function attachThumbs(){ for(const el of $$('.im[data-thumb]')){ const path=el.getAttribute('data-thumb'); if(!path) continue;
    const fb=el.getAttribute('data-fbox');
    if(fb&&window.LFFace){ try{ LFFace.into(el,{path:path,box:LFFace.normBox(JSON.parse(fb)),size:220,keep:true,priority:true}); continue; }catch(e){} }
    if(el.hasAttribute('data-fbox')&&window.LFFace){ try{ LFFace.into(el,{path:path,box:null,size:220,keep:true,priority:true}); continue; }catch(e){} }
    try{ const s=await sb.storage.from('family').createSignedUrl(path,3600,LFDB.img(path,400)); const u=s&&s.data&&s.data.signedUrl; if(u){ const img=new Image(); img.onload=()=>{ el.innerHTML=''; el.appendChild(img); }; img.src=u; } }catch(e){} } }

  /* ---------- keeper actions (per-field / per-row, Rule 3) ---------- */
  async function approveRef(ref){ if(!user||!state.keeper) return; const [kind,id]=ref.split(':'); const now=new Date().toISOString();
    /* A connection proposal becomes real here and only here: the named person is
       created if the family has never met them, then the tie itself is written. */
    /* a face on a photograph: welcome it, and the person in it if they are new too */
    if(kind==='tag'){
      const L=d();
      if(approveRef._busy) return; approveRef._busy=true;
      const parts=String(id).split('|'), aid=parts[0], pid=parts[1];
      const up=await sb.from('artefact_subjects')
        .update({status:'published', reviewed_by:user.id, published_at:now})
        .eq('artefact_id',aid).eq('person_id',pid);
      if(up.error){ approveRef._busy=false; toast(L.tFail||'That did not save.',false); return; }
      /* a name first met on this photograph enters the forest with it */
      await sb.from('people').update({status:'published', reviewed_by:user.id, published_at:now})
        .eq('id',pid).eq('status','in_review');
      /* a face welcomed onto a photograph may be the first picture this person has */
      try{
        if(window.LFPortrait){
          const who=await sb.from('people').select('portrait_path').eq('id',pid).maybeSingle();
          if(!(who&&who.data&&who.data.portrait_path)){
            const tg2=(pending.tags||[]).find(x=>x.artefact_id===aid&&x.person_id===pid);
            const art=await sb.from('artefacts').select('storage_path').eq('id',aid).maybeSingle();
            if(art&&art.data&&art.data.storage_path&&tg2&&tg2.detail)
              await LFPortrait.bake(sb, pid, art.data.storage_path, tg2.detail);
          }
        }
      }catch(e){}
      approveRef._busy=false; await reload(); toast(L.tWelcomed||'Welcomed.',true); return;
    }
    if(kind==='kin'){
      const L=d();
      /* A second tap must never make a second person. Leon's approval of Anna Tihonov
         ran twice 650ms apart and created her twice, with two sibling ties. The guard
         is held in memory AND checked against the row, because the row is the only
         thing that survives a reload. */
      if(approveRef._busy) return; approveRef._busy=true;
      try{
        const still=await sb.from('person_facts').select('status').eq('id',id).single();
        if(still.error||!still.data||still.data.status!=='in_review'){ await reload(); return; }
      }catch(e){ approveRef._busy=false; return; }
      const f=(pending.facts||[]).find(x=>x.id===id); if(!f){ approveRef._busy=false; return; }
      let k=null; try{ k=JSON.parse(f.value); }catch(e){}
      if(!k||!k.kind){ approveRef._busy=false; toast(L.tCannot||'That suggestion could not be read.',false); return; }
      let other=k.other;
      if(!other){
        const nm=String(k.propose||k.other_name||'').trim();
        if(!nm){ approveRef._busy=false; toast(L.tCannot||'That suggestion could not be read.',false); return; }
        const mk=await sb.from('people').insert({created_by:f.created_by,status:'published',
                   reviewed_by:user.id,published_at:now}).select('id').single();
        if(mk.error||!mk.data){ approveRef._busy=false; toast(L.tFail||'That did not save.',false); return; }
        other=mk.data.id;
      }
      /* from_person = PARENT, to_person = CHILD. The direction vocabulary is
         'other_parent' / 'other_child' - person-real's relEnds() has always said so. I
         invented 'in'/'from', values that never occur, so every parent tie approved from
         this queue was written INVERTED: Leon proposed Mote-Laser as Anna's parent and
         got Anna as Mote-Laser's parent, which made her Basya's grandmother and her
         sibling at once, and flattened the whole tree. Same rule as relEnds now. */
      let from=f.person_id, to=other;
      if(k.kind==='parent' && k.dir==='other_parent'){ from=other; to=f.person_id; }
      if(k.kind==='child'  && k.dir==='other_child'){  from=f.person_id; to=other; }
      const rel=await sb.from('relationships').insert({from_person:from,to_person:to,kind:k.kind,
                  certainty:k.certainty||'documented',note:k.note||'',status:'published',
                  created_by:f.created_by,reviewed_by:user.id});
      if(rel.error){ approveRef._busy=false; toast(L.tFail||'That did not save.',false); return; }
      const fin=await sb.from('person_facts').update({status:'published',reviewed_by:user.id,published_at:now}).eq('id',id);
      if(fin.error){ approveRef._busy=false; toast(L.tFail||'That did not save.',false); return; }
      approveRef._busy=false;
      await reload(); toast(L.tWelcomed||'Welcomed.',true); return;
    }
    if(kind==='fact'){ const f=(pending.facts||[]).find(x=>x.id===id); if(f){ const patch={};
        /* A year is often all anyone knows. These are DATE columns, so "1897" and
           "1897-1964" - what a family member actually types - came back 22007 and
           the approval died in silence. Parse to a real date plus how much of it
           is true, and if it cannot be read honestly, leave the fact for a human
           rather than write a day nobody meant. */
        if(f.field==='birth'||f.field==='death'){
          const which=f.field==='birth'?'birth':'death';
          if(!f.value){ patch[which+'_date']=null; patch[which+'_precision']=null; }
          else{
            const d=window.LFDate&&LFDate.parse(f.value);
            if(d){ patch[which+'_date']=d.date; patch[which+'_precision']=d.precision; }
            else { toast((d().tBadDate)||('Could not read the date "'+String(f.value).slice(0,20)+'"'),false); return; }
          }
        }
        /* The page speaks its own words, the database speaks enums. 'exact' is not a
           certainty (documented | remembered | uncertain) and 'f' is not a sex
           (female | male), so approving either threw 22P02 and 23514 and the
           keeper's decision silently did nothing. Translate at the boundary. */
        if(f.field==='birth_prec'){
          const CERT={exact:'documented',month:'remembered',year:'remembered',circa:'uncertain',unknown:'uncertain'};
          patch.birth_certainty=CERT[f.value]||null;
        }
        if(f.field==='living')patch.is_living=(f.value==='1');
        if(f.field==='gender')patch.sex=({f:'female',m:'male'})[f.value]||null;   /* words, not letters */
        if(f.field==='face'){ try{ const fv=JSON.parse(f.value); patch.primary_asset=fv.storage_path;
            /* A HUMAN'S FRAMING OUTRANKS A DETECTOR'S GUESS. A face fact carries both the
             tagger's detection box AND the zoom/px/py a person set by hand; this read the
             box FIRST, so Leon's deliberate framing was thrown away on approval and the
             person page drew the detector's rectangle while the editor reopened his - the
             same portrait wrong in one place and right in the other. Gold is human-entered:
             if someone framed it, that is the portrait. */
          /* THE EXACT BOX IS THE FRAMING. When the crop stage was rebuilt over the whole
             photograph, px/py changed meaning - they are fractions of the WHOLE image now,
             not a position inside its centred square - but this still preferred them, and
             zoomToPx reads them with the old ruler. So Leon framed correctly, approved, and
             the page drew somewhere else again. The box carries the human's framing in whole-
             image fractions; the stage numbers are legacy and only used when there is no box. */
          const fb2=(fv.box&&(fv.box.w>0))?fv.box:((fv.zoom!=null)?{zoom:fv.zoom,px:fv.px,py:fv.py}:null);
            const per=(pending.personRow&&pending.personRow[f.person_id])||{};
            if(fb2) patch.metadata=Object.assign({},per.metadata||{},{face_box:fb2}); 
            /* Bake the portrait HERE - inside the block where fv and the chosen box exist.
               My first attempt put this call outside it, wrapped in try/catch, so it threw a
               ReferenceError on names that were not in scope and did nothing, quietly: the
               framing was approved and no picture was made. Silent failure, in the code
               written to end silent failures, again. */
            try{ if(window.LFPortrait && fv && fv.storage_path)
                   await LFPortrait.bake(sb, f.person_id, fv.storage_path, fb2); }catch(e){}
          }catch(e){}
          /* one portrait per person: supersede older published crops and stale pending suggestions */
          try{ await sb.from('person_facts').delete().eq('person_id',f.person_id).eq('field','face').neq('id',id); }catch(e){} }
        if(Object.keys(patch).length && f.person_id){ try{ await sb.from('people').update(patch).eq('id',f.person_id); }catch(e){} }
        /* one published part per (person,lang,field): supersede the old one first,
           else person_facts_one_published_name_part rejects the publish (the silent
           root of every stubborn approval). The new value is already stored. */
        const NAMEPARTS=['given','family','patronymic','maiden','called','honorific'];
        if(NAMEPARTS.includes(f.field)){ try{ await sb.from('person_facts').delete().eq('person_id',f.person_id).eq('lang',f.lang).eq('field',f.field).eq('status','published').neq('id',id); }catch(e){} }
        const u=await sb.from('person_facts').update({status:'published',reviewed_by:user.id,published_at:now}).eq('id',id);
        if(u.error){ console.error('approve fact',u.error); await reload(); toast(d().approveFail,false); return; }
        /* the translations the app made from these words go with them: one decision */
        for(const m of mtSiblings(f)){
          const um=await sb.from('person_facts').update({status:'published',reviewed_by:user.id,published_at:now}).eq('id',m.id);
          if(um.error) console.error('approve translation',um.error);
        } } }
    else if(kind==='remreq'){
      const req=(pending.facts||[]).find(x=>x.id===id); if(!req) return;
      for(const r of removeTargets(req.value)){ try{ await sb.from('person_facts').delete().eq('id',r.id); }catch(e){} }
      try{ await sb.from('person_facts').delete().eq('id',id); }catch(e){}
    }
    else if(kind==='clearreq'){
      /* birth, death and gender live on people columns as well as in facts, so clearing one
         means emptying BOTH - a column left behind would refill the page on the next load. */
      const req=(pending.facts||[]).find(x=>x.id===id); if(!req) return;
      const COL={ birth:{birth_date:null,birth_certainty:null}, death:{death_date:null,death_precision:null},
                  gender:{sex:null} };
      const patch=COL[req.value];
      if(patch && req.person_id){ try{ await sb.from('people').update(patch).eq('id',req.person_id); }catch(e){} }
      try{ await sb.from('person_facts').delete().eq('person_id',req.person_id).eq('field',req.value); }catch(e){}
      try{ await sb.from('person_facts').delete().eq('id',id); }catch(e){}
    }
    else if(kind==='group'){
      const NAMEPARTS2=['given','family','patronymic','maiden','called','honorific'];
      for(const ff of (pending.facts||[]).filter(x=>x.group_id===id&&x.status!=='published')){
        if(NAMEPARTS2.includes(ff.field)){ try{ await sb.from('person_facts').delete().eq('person_id',ff.person_id).eq('lang',ff.lang).eq('field',ff.field).eq('status','published').neq('id',ff.id); }catch(e){} }
        const u2=await sb.from('person_facts').update({status:'published',reviewed_by:user.id,published_at:now}).eq('id',ff.id);
        if(u2.error){ console.error('approve group',u2.error); await reload(); toast(d().approveFail,false); return; } } }
    else if(kind==='artefact'){ try{ await sb.from('artefacts').update({status:'published',reviewed_by:user.id,published_at:now}).eq('id',id); }catch(e){ try{ await sb.from('artefacts').update({status:'published',reviewed_by:user.id}).eq('id',id); }catch(e2){} } }
    /* A TRANSLATION IS NOT A DECISION (Leon, 2026-08-20). The app's own retellings were
       filed as waiting - and the keeper's page never listed them, so there was no way to
       approve one and they would have waited forever. They go live with the memory they
       came from. A person's own retelling still waits, as it always did. */
    if(kind==='aedit'){
      const e0=(pending.edits||[]).find(x=>x.id===id); if(!e0){ await reload(); return; }
      const aid=e0.artefact_id;
      if(e0.field==='moment_delete'){
        /* the whole memory goes, and everything hanging off it - a photograph left in the
           bucket with no row pointing at it is invisible and permanent */
        try{ if(e0.old_value) await sb.storage.from('family').remove([e0.old_value]); }catch(x){}
        try{ await sb.from('artefact_subjects').delete().eq('artefact_id',aid); }catch(x){}
        try{ await sb.from('artefact_translations').delete().eq('artefact_id',aid); }catch(x){}
        try{ await sb.from('artefact_edits').delete().eq('artefact_id',aid); }catch(x){}
        try{ await sb.from('artefacts').delete().eq('id',aid); }catch(x){}
        await reload(); toast(d().approved,true); return;
      }
      if(e0.field==='photo_delete'){
        try{ if(e0.old_value) await sb.storage.from('family').remove([e0.old_value]); }catch(x){}
        try{ await sb.from('artefacts').update({storage_path:null}).eq('id',aid); }catch(x){}
      } else if(e0.field==='where'||e0.field==='when'){
        try{ const {data:a1}=await sb.from('artefacts').select('metadata').eq('id',aid).maybeSingle();
          const md=Object.assign({},(a1&&a1.metadata)||{}); md[e0.field]=e0.new_value;
          await sb.from('artefacts').update({metadata:md}).eq('id',aid); }catch(x){}
      } else if(e0.field==='photo'&&e0.new_value){
        try{ await sb.from('artefacts').update({storage_path:e0.new_value}).eq('id',aid); }catch(x){}
      }
      try{ await sb.from('artefact_edits').delete().eq('id',id); }catch(x){}
      await reload(); toast(d().approved,true); return;
    }
    if(kind==='telling'){ try{ await sb.from('artefact_translations')
      .update({status:'published',reviewed_by:user.id,published_at:now}).eq('id',id); }catch(e){}
      await reload(); toast(d().approved,true); return; }
    if(kind==='artefact'){ try{ await sb.from('artefact_translations')
      .update({status:'published',reviewed_by:user.id,published_at:now})
      .eq('artefact_id',id).eq('machine',true); }catch(e){} }
    /* A PLACE LEARNS ITS NAMES WHEN THE MEMORY IS APPROVED (Leon, 2026-08-20).
       Until now a place was only looked up when somebody opened its own page - so
       Хабаровск sits on his father's army photograph with no names at all, and a Hebrew
       reader sees Cyrillic until someone happens to wander there. Approving is the
       moment a place enters the forest, and the right moment to learn it.
       Deliberately not awaited: the lookup waits over a second between languages to be
       polite to the map service, about three and a half seconds a place, and the keeper
       should not sit through that. It is a place we have never seen before or nothing. */
    if(kind==='artefact'){ try{
      const a0=(pending.arts||[]).find(x=>x.id===id);
      const wh=a0&&a0.metadata&&a0.metadata.where;
      if(wh&&window.LFPlace&&LFPlace.ensure){
        const known=await sb.from('place_geo').select('name_en,name_ru,name_he').eq('name',wh).maybeSingle();
        const k=known&&known.data;
        if(!k||!k.name_en||!k.name_ru||!k.name_he){
          LFPlace.ensure(wh, state.lang||'en', sb).then(function(){},function(){});
        }
      }
    }catch(e){} }
    else if(kind==='person'){ try{ await sb.from('people').update({status:'published',reviewed_by:user.id,published_at:now}).eq('id',id); }catch(e){ try{ await sb.from('people').update({status:'published'}).eq('id',id); }catch(e2){} } }
    else if(kind==='rel'){ const r=(pending.rels||[]).find(x=>x.id===id);
      if(r && matchesPublished(r)){ // removal request: delete the live tie it mirrors, then the request
        const k=r.kind||'parent';
        const tw=(pending.pubRels||[]).find(p=>(p.kind||'parent')===k && ((p.from_person===r.from_person&&p.to_person===r.to_person)||((k==='spouse'||k==='sibling')&&p.from_person===r.to_person&&p.to_person===r.from_person)));
        if(tw){ try{ await sb.from('relationships').delete().eq('id',tw.id); }catch(e){} }
        try{ await sb.from('relationships').delete().eq('id',id); }catch(e){}
      } else { let u=await sb.from('relationships').update({status:'published',reviewed_by:user.id,published_at:now}).eq('id',id);
        if(u.error){ u=await sb.from('relationships').update({status:'published',reviewed_by:user.id}).eq('id',id); if(u.error) await sb.from('relationships').update({status:'published'}).eq('id',id); } } }
    await reload(); toast(d().approved,true);
  }
  async function declineRef(ref){
    { const [k0,i0]=ref.split(':'); const L=d();
      if(k0==='tag'){ const pr=String(i0).split('|');
        const r=await sb.from('artefact_subjects').delete().eq('artefact_id',pr[0]).eq('person_id',pr[1]);
        if(r.error){ toast(L.tFail||'That did not save.',false); return; }
        await reload(); toast(L.tDeclined||'Declined.',false); return; }
      if(k0==='kin'){ const r=await sb.from('person_facts').update({status:'declined'}).eq('id',i0);
        if(r.error){ toast(L.tFail||'That did not save.',false); return; }
        await reload(); toast(L.tDeclined||'Declined.',false); return; } } if(!user||!state.keeper) return; const [kind,id]=ref.split(':');
    if(kind==='fact'){
      /* the translations made from these words are declined with them; left behind they
         would sit in the queue forever, orphaned from the sentence they came from */
      const f0=(pending.facts||[]).find(x=>x.id===id);
      for(const m of mtSiblings(f0)){ try{ await sb.from('person_facts').delete().eq('id',m.id); }catch(e){} }
      try{ await sb.from('person_facts').delete().eq('id',id); }catch(e){} }
    else if(kind==='telling'){ try{ await sb.from('artefact_translations').delete().eq('id',id); }catch(e){} }
    else if(kind==='aedit'){ try{ await sb.from('artefact_edits').delete().eq('id',id); }catch(e){} }
    else if(kind==='remreq'||kind==='clearreq'){ try{ await sb.from('person_facts').delete().eq('id',id); }catch(e){} }
    else if(kind==='group'){ for(const ff of (pending.facts||[]).filter(x=>x.group_id===id)){ try{ await sb.from('person_facts').delete().eq('id',ff.id); }catch(e){} } }
    else if(kind==='artefact'){ try{ await sb.from('artefacts').update({status:'declined'}).eq('id',id); }catch(e){} }
    else if(kind==='person'){ try{ await sb.from('people').update({status:'declined'}).eq('id',id); }catch(e){} }
    else if(kind==='rel'){ try{ await sb.from('relationships').delete().eq('id',id); }catch(e){} } // drop the pending request; a live tie it mirrored stays untouched
    await reload(); toast(d().declined,false);
  }

  /* ---------- audio ---------- */
  let audio=null;
  async function playVoice(path){ if(!path) return; try{ const s=await sb.storage.from('family').createSignedUrl(path,3600); const u=s&&s.data&&s.data.signedUrl; if(!u) return; if(audio){ audio.pause(); } audio=new Audio(u); audio.play().catch(()=>{}); }catch(e){} }

  /* ---------- language sheet ---------- */
  function openLang(){ const sh=$('.sheet[data-sheet="lang"]'); const L=d();
    sh.innerHTML=`<div class="grip"></div><h3>${esc(L.langtitle)}</h3><div class="sub">${esc(L.langsub)}</div>`
      + LANGS.map(l=>`<button class="lang-opt${l===state.lang?' on':''}" data-setlang="${l}"><span><span class="native">${esc(T[l].native)}</span><span class="en">${esc(T[l].en)}</span></span><span class="tick">${IC.check}</span></button>`).join('');
    $('.scrim').classList.add('show'); sh.classList.add('show');
  }
  function hideSheets(){ $('.scrim').classList.remove('show'); $$('.sheet').forEach(s=>s.classList.remove('show')); }
  function setLang(l){ if(!T[l]) return; state.lang=l; try{ localStorage.setItem('lf_lang',l); }catch(e){} if(user) try{ sb.from('profiles').update({preferred_lang:l}).eq('id',user.id); }catch(e){} hideSheets(); render(); }

  /* ---------- toast ---------- */
  let toTimer=null;
  /* a failure may not pass in silence: lf-db speaks through this page's own voice */
  try{ LFDB.onFailure=function(m){ toast(m,false); }; }catch(e){}
  function toast(msg,good){ const t=$('.toast'); t.querySelector('.toastmsg').textContent=msg;
    t.querySelector('.fl').style.background=good===false?'var(--coral)':'var(--leaf)';
    t.querySelector('.fl').style.boxShadow=good===false?'0 0 10px 2px var(--coral)':'0 0 10px 2px var(--leaf)';
    t.classList.add('show'); clearTimeout(toTimer); toTimer=setTimeout(()=>t.classList.remove('show'),2600); }

  /* ---------- wiring ---------- */
  function wire(){ const root=$('#dev');
    root.addEventListener('click', async e=>{
      const ap=e.target.closest('[data-approve]'); if(ap){ await approveRef(ap.getAttribute('data-approve')); return; }
      const dc=e.target.closest('[data-decline]'); if(dc){ await declineRef(dc.getAttribute('data-decline')); return; }
      const fl=e.target.closest('[data-filter]'); if(fl){ activeFilter=fl.getAttribute('data-filter'); render(); return; }
      const pl=e.target.closest('[data-play]'); if(pl){ playVoice(pl.getAttribute('data-play')); return; }
      const sl=e.target.closest('[data-setlang]'); if(sl){ setLang(sl.getAttribute('data-setlang')); return; }
      const a=e.target.closest('[data-act]'); if(!a) return; const act=a.dataset.act;
      if(act==='back'){ if(history.length>1) history.back(); else location.href='index.html'; return; }
      if(act==='lang'){ openLang(); return; }
      if(act==='close'){ hideSheets(); return; }
    });
  }

  /* ---------- gate + boot ---------- */
  /* At the gate: signed-up family waiting for the keeper's welcome (is_member=false).
     One tap opens the whole forest to them — the funnel's other half. */
  let atGate=[];
  async function loadGate(){ try{
      const {data}=await sb.from('profiles').select('id,display_name,created_at,is_member,is_keeper');
      atGate=(data||[]).filter(p=>!p.is_member&&!p.is_keeper);
    }catch(e){ atGate=[]; } }
  function gateSection(){ const L=d();
    if(!atGate.length) return '';
    return `<div class="sec" style="border:1px solid rgba(243,205,132,.45);border-radius:16px;padding:14px 15px;margin-bottom:16px;background:rgba(243,205,132,.05)">
      <div style="font-family:'Azeret Mono',monospace;font-size:10px;letter-spacing:.25em;color:var(--gold,#f3cd84);text-transform:uppercase">${esc(L.gateT)}</div>
      <div style="font-size:13px;color:#b8c6d4;margin:4px 0 10px">${esc(L.gateSub(atGate.length))}</div>
      ${atGate.map(p=>`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid rgba(180,205,235,.12)">
        <span style="flex:1;font-size:15px" class="serif">${esc(p.display_name||'')}</span>
        <button data-welcome="${esc(p.id)}" style="border-radius:99px;padding:7px 15px;font-size:12.5px;cursor:pointer;font-family:inherit;border:1px solid rgba(143,214,160,.55);color:#8fd6a0;background:rgba(143,214,160,.1)">${esc(L.welcome)}</button>
      </div>`).join('')}
    </div>`; }
  function wireGate(){ document.querySelectorAll('[data-welcome]').forEach(b=>b.onclick=async()=>{
      const id=b.getAttribute('data-welcome'); const L=d();
      const nm=(atGate.find(x=>x.id===id)||{}).display_name||'';
      const u=await sb.from('profiles').update({is_member:true}).eq('id',id);
      if(u.error){ console.error('welcome',u.error); toast(L.approveFail,false); return; }
      toast(L.welcomed(nm));
      await loadGate(); render();
    }); }
  async function reload(){ await loadData(); await loadGate(); render(); }
  function showGate(){ const L=d(); let g=$('#gate'); if(!g){ g=document.createElement('div'); g.id='gate'; g.className='gate'; $('#dev').appendChild(g); }
    g.innerHTML=`<div class="card">
      <h3>${esc(L.gateTitle)}</h3><div class="gsub">${esc(L.gateSub)}</div>
      <input id="gEmail" type="email" autocomplete="email" placeholder="you@example.com">
      <input id="gPass" type="password" autocomplete="current-password" placeholder="••••••••">
      <button id="gBtn" class="gbtn">${esc(L.signin)}</button>
      <div class="gerr" id="gErr"></div></div>`;
    $('#gBtn').onclick=async()=>{ const {error}=await sb.auth.signInWithPassword({email:$('#gEmail').value.trim(),password:$('#gPass').value}); if(error){ $('#gErr').textContent=error.message; return; } g.remove(); boot(); };
  }
  async function boot(){ const {data:{session}}=await sb.auth.getSession();
    const stored=localStorage.getItem('lf_lang'); if(stored&&T[stored]) state.lang=stored; else { const dl=(navigator.language||'en').slice(0,2); if(T[dl]) state.lang=dl; }
    if(!session){ user=null; render(); showGate(); return; }
    user=session.user;
    try{ const {data:pr}=await sb.from('profiles').select('is_keeper,preferred_lang').eq('id',user.id).maybeSingle();
      if(pr){ state.keeper=!!pr.is_keeper; if(state.keeper){ window.__lfKeeper=true; try{document.dispatchEvent(new Event('lf-keeper-ready'));}catch(e){} } if(pr.preferred_lang&&!stored&&T[pr.preferred_lang]) state.lang=pr.preferred_lang; } }catch(e){}
    if(!state.keeper){ render(); return; }
    await loadData(); await loadGate(); render();   /* the gate is asked on every open, not only after an approval */
  }
  wire(); boot();
})();
</script>

<script>
/* pending anchors — "who they say they are". Active immediately; keepers confirm or decline. */
(function(){
  var SB_URL='https://oabcdrktuikifbormjip.supabase.co';
  var SB_KEY='sb_publishable_MnuwKTP5JaUy-P8-bKWsgA_f98esOXC';
  var SB_STORE='sb-oabcdrktuikifbormjip-auth-token';
  function sess(){ try{ var raw=localStorage.getItem(SB_STORE); if(!raw) return null;
    if(raw.slice(0,7)==='base64-') raw=atob(raw.slice(7));
    var s=JSON.parse(raw); var tok=s.access_token; if(!tok) return null;
    var uid=(s.user&&s.user.id)||null;
    if(!uid){ try{ uid=JSON.parse(atob(tok.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).sub; }catch(e){} }
    return uid?{token:tok,uid:uid}:null; }catch(e){ return null; } }
  var S=sess(); if(!S) return;
  function api(path,opts){ opts=opts||{}; opts.headers=Object.assign({apikey:SB_KEY,Authorization:'Bearer '+S.token,

    return fetch(SB_URL+'/rest/v1/'+path,opts); }
  function esc(x){ return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

    var uj=await (await api('profiles?select=id,display_name&id=in.('+uids.join(',')+')')).json();
    var P={},U={}; (pj||[]).forEach(function(p){P[p.id]=p.display_name;}); (uj||[]).forEach(function(u){U[u.id]=u.display_name;});
    var host=document.createElement('div');

    rows.forEach(function(x){

    });
    host.innerHTML=h;
    var sc=document.getElementById('screen')||document.body;
    sc.insertBefore(host, sc.children[1]||null);
    host.addEventListener('click',async function(e){
      var b=e.target.closest('button[data-a]'); if(!b) return;

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',go); else go();
})();
</script>
