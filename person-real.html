  /* ---------- connections: the real relationships row ----------
     mode 'add'    — connect this person to someone already in the forest
     mode 'edit'   — change kind / certainty / note on an existing row
     mode 'me'     — "How are you related?": the viewer's own node → this person   */
  function openKin(mode,relId){ const L=d(); const sh=$('.sheet[data-sheet="kin"]');
    const existing=relId?rels.find(r=>r.id===relId):null;
    const st={ mode, relId:relId||null,
      other:existing?existing.other:(mode==='me'?(localStorage.getItem('lf_me')||''):''),
      kind:existing?existing.kind:'parent', dir:existing?existing.dir:'other_parent',
      certainty:existing?existing.certainty:'remembered', note:existing?existing.note:'', propose:'' };
    const nameOf=id=>{ const p=PEOPLE.find(x=>x.id===id); return p?p.display_name:''; };
    const title=mode==='edit'?L.editconn:(mode==='me'?L.howrelated:L.addconn);
    const sub=mode==='me'?L.meHint:(mode==='edit'?'':L.kinApp);

    function pickerHTML(){
      /* Editing a connection used to freeze the other person entirely - no picker, no way
         to name someone the forest has never met - so 'someone not in the forest yet'
         vanished exactly when a contributor wanted to correct who a tie points at. It is
         the same picker as adding now, with the current person shown above it.
         ('me' mode still hides it, and correctly: you are saying WHICH EXISTING PERSON you
         are, and a person who does not exist cannot be you.) */
      const wasChosen = (mode==='edit'&&existing&&existing.name)
        ? `<div class="field" style="padding-bottom:2px"><label>${L.pickperson}</label><div class="np-val serif">${esc(existing.name)}</div></div>` : '';
      const q=(st.q||'').toLowerCase();
      const list=PEOPLE.filter(p=>!q||String(p.display_name||'').toLowerCase().includes(q)).slice(0,200);
      return wasChosen+`<div class="field"><label>${mode==='me'?L.meAsk:(mode==='edit'?L.pickperson:L.pickperson)}</label>
        <input class="inp" data-kinsearch placeholder="${esc(L.searchppl)}" value="${esc(st.q||'')}" style="margin-bottom:9px">
        <div class="picker">${list.length?list.map(p=>`<button data-kinpick="${esc(p.id)}" class="${st.other===p.id?'on':''}">${esc(p.display_name||'—')}</button>`).join(''):`<div class="sub" style="padding:12px">${L.nopeople}</div>`}</div>
        ${mode==='me'?'':`<label>${L.proposenew}</label>
        <input class="inp" data-kinpropose placeholder="${esc(L.proposename)}" value="${esc(st.propose||'')}">
        <div class="hint">${L.proposehint}</div>`}</div>`; }

    function draw(){
      const dirLine='';
      const canRemove=mode==='edit';
      sh.innerHTML=`<div class="grip"></div><h3>${esc(title)}</h3>${sub?`<div class="sub">${esc(sub)}</div>`:''}
        ${pickerHTML()}
        <div class="field"><label>${(function(){
            const them=st.other?nameOf(st.other):String(st.propose||'').trim();
            const me=(PERSONA&&PERSONA.name)||(person&&(person.display_name||person.called_name))||'';
            return (them&&me&&L.relkindWho)?L.relkindWho.replace('{a}',them).replace('{b}',me):L.relkind;
          })()}</label><div class="segwrap" data-kingroup="kind">
          ${REL_KINDS.map(k=>`<button data-kinset="kind:${k}" class="${st.kind===k?'on':''}">${esc(L.relkinds[k])}</button>`).join('')}</div></div>
        ${dirLine}
        <div class="field"><label>${L.certainty}</label><div class="segwrap" data-kingroup="certainty">
          ${REL_CERTS.map(c=>`<button data-kinset="certainty:${c}" class="${st.certainty===c?'on':''}">${esc(L.certs[c])}</button>`).join('')}</div></div>
        <div class="field"><label>${L.relnote}</label><input class="inp" data-kinnote value="${esc(st.note||'')}" placeholder="${esc(L.relnote)}"></div>
        ${state.keeper?'':`<div class="hint" style="display:flex;gap:9px">${sv(I.info,1.7)}<span>${esc(L.keeper)}</span></div>`}
        <div class="btnrow"><button class="btn ghost" data-act="close">${L.cancel}</button>
          <!-- this said Save to a keeper while saveRel has sent every tie to the queue since
               2026-08-07 - the button was promising something the code had stopped doing -->
          <button class="btn violet" data-act="kinsave">${L.send}</button></div>
        ${canRemove?`<div class="btnrow"><button class="btn ghost" data-act="kinremove" style="color:var(--edit-hi);border-color:rgba(201,162,255,.4)">${sv(I.trash,1.7)} ${esc(L.removeconn)}</button></div>`:''}`;
      const s=sh.querySelector('[data-kinsearch]'); if(s) s.oninput=e=>{ st.q=e.target.value; draw(); const n=sh.querySelector('[data-kinsearch]'); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); } };
      const np=sh.querySelector('[data-kinnote]'); if(np) np.oninput=e=>{ st.note=e.target.value; };
      const pp=sh.querySelector('[data-kinpropose]'); if(pp) pp.oninput=e=>{ st.propose=e.target.value; };
      sh.querySelectorAll('[data-kinpick]').forEach(b=>b.onclick=()=>{ st.other=b.getAttribute('data-kinpick'); st.propose=''; draw(); });
      sh.querySelectorAll('[data-kinset]').forEach(b=>b.onclick=()=>{ const [k,v]=b.getAttribute('data-kinset').split(':');
        st[k]=v;
        /* 'Child' and 'Parent' are the same row seen from two ends: the chip decides the
           direction so the contributor never has to. */
        if(k==='kind'){ if(v==='parent') st.dir='other_parent'; else if(v==='child') st.dir='other_child'; }
        draw(); });
    }
    sh._kinSave=async()=>{
      if(mode!=='edit'&&!st.other&&!String(st.propose||'').trim()){ toast(L.pickfirst); return; }
      if(mode==='me'&&st.other) { try{ localStorage.setItem('lf_me',st.other); }catch(e){} }
      /* "Parent" alone can be read either way round - Leon read the button as saying
         BASYA was the parent. Say it back as a whole sentence, naming both people and
         which of them is which, before anything is written. */
      {
        const them=st.other?nameOf(st.other):String(st.propose||'').trim();
        const me=(person&&(person.display_name||person.called_name))||nameOf(PERSON_ID)||'';
        /* from here on, 'child' IS 'parent' with the direction flipped - the store, the
         conflict check, the sentence and the mini-tree all speak that one vocabulary */
      const kindForStore = (st.kind==='child') ? 'parent' : st.kind;
      const clash=await kinConflict(st.other, kindForStore, st.dir);
        if(clash){ toast((L.clash&&L.clash[clash])||L.clashOther||'That connection cannot be true — the forest already says otherwise.'); return; }
        const line=kinSentence(them, me, kindForStore, st.dir, state.lang);
        if(line){
          const YES={en:'Yes, tie them',ru:'Да, связать',he:'כן, לקשור'};
          const NO ={en:'Not yet',      ru:'Пока нет',  he:'עוד לא'};
          /* Who the tree would draw HIGHER, using relEnds' own rule - so the picture and
             the row that gets written cannot disagree. */
          const themIsUpper = (kindForStore==='parent') ? (st.dir==='other_parent') : true;
          const ok = (window.LFBind)
            ? await LFBind.ask({ line:line.replace(/\n+.*$/,''), kind:kindForStore, dir:st.dir, lang:state.lang,
                upper: themIsUpper?them:me, lower: themIsUpper?me:them,
                rtl:(state.lang==='he'), yes:YES[state.lang]||YES.en, no:NO[state.lang]||NO.en })
            : confirm(line);
          if(!ok) return;
        }
      }
      await saveRel({ relId:st.relId, other:st.other, other_name:st.other?nameOf(st.other):String(st.propose||'').trim(),
        propose:st.other?'':String(st.propose||'').trim(), kind:kindForStore, dir:st.dir, certainty:st.certainty, note:st.note, mode });
      hideSheets(); await reload(); selectFacet('kin'); toast(L.sent); };
    sh._kinRemove=async()=>{ await removeRel(st.relId); hideSheets(); await reload(); selectFacet('kin'); toast(L.sent); };
    draw(); showSheet('kin'); }

  /* A TIE THAT CANNOT BE TRUE IS REFUSED BEFORE IT IS ASKED.
     The tree can now survive a contradiction, but surviving one is not the same as never
     making one: Leon's inverted parent tie sat published for a day and flattened the tree.
     This walks the published graph and answers whether the proposal would make someone
     their own ancestor, or a parent of their own sibling. A person who does not exist yet
     cannot contradict anything, so a brand-new name always passes. */
  async function kinConflict(otherId, kind, dir){
    if(!otherId) return null;
    let rows=[];
    try{ const r=await sb.from('relationships').select('from_person,to_person,kind').eq('status','published');
      if(r.error) return null; rows=r.data||[]; }catch(e){ return null; }
    const par={}, sib={};
    rows.forEach(x=>{
      if(x.kind==='parent'){ (par[x.to_person]=par[x.to_person]||[]).push(x.from_person); }
      else if(x.kind==='sibling'){ (sib[x.from_person]=sib[x.from_person]||[]).push(x.to_person);
                                   (sib[x.to_person]=sib[x.to_person]||[]).push(x.from_person); }
    });
    const ancestorsOf=id=>{ const out=new Set(), st=[id];
      while(st.length){ const c=st.pop(); (par[c]||[]).forEach(pp=>{ if(!out.has(pp)){ out.add(pp); st.push(pp); } }); }
      return out; };
    let P=null,C=null;
    if(kind==='parent'){ if(dir==='other_parent'){ P=otherId; C=PERSON_ID; } else { P=PERSON_ID; C=otherId; } }
    else if(kind==='child'){ if(dir==='other_child'){ P=PERSON_ID; C=otherId; } else { P=otherId; C=PERSON_ID; } }
    if(P&&C){
      if(P===C) return 'self';
      if((sib[P]||[]).indexOf(C)>=0) return 'siblingParent';
      if(ancestorsOf(P).has(C)) return 'loop';
    }
    if(kind==='sibling'){
      if(otherId===PERSON_ID) return 'self';
      if(ancestorsOf(PERSON_ID).has(otherId)||ancestorsOf(otherId).has(PERSON_ID)) return 'siblingAncestor';
    }
    return null;
  }

  /* Reads back exactly what is about to be recorded. `them` is the person just
     chosen, `me` is whose page we are on. dir tells us which way the tie runs. */
  function kinSentence(them, me, kind, dir, lang){
    if(!them||!me) return '';
    const K={
      parent:{en:'{a} is a parent of {b}.',      ru:'{a} — родитель {b}.',        he:'{a} — הורה של {b}.'},
      child:{ en:'{a} is a child of {b}.',       ru:'{a} — ребёнок {b}.',         he:'{a} — ילד/ה של {b}.'},
      spouse:{en:'{a} is married to {b}.',       ru:'{a} — супруг(а) {b}.',       he:'{a} — בן/בת זוג של {b}.'},
      sibling:{en:'{a} and {b} are siblings.',   ru:'{a} и {b} — брат или сестра.', he:'{a} ו{b} הם אחים/אחיות.'},
      friend:{en:'{a} is a friend of {b}.',      ru:'{a} — друг {b}.',            he:'{a} — חבר/ה של {b}.'},
      mentor:{en:'{a} is a mentor to {b}.',      ru:'{a} — наставник {b}.',       he:'{a} — מורה דרך של {b}.'},
      neighbour:{en:'{a} is a neighbour of {b}.',ru:'{a} — сосед {b}.',           he:'{a} — שכן/ה של {b}.'},
      other:{en:'{a} is connected to {b}.',      ru:'{a} связан(а) с {b}.',       he:'{a} מקושר/ת ל{b}.'}
    };
    const ASK={ en:'\n\nIs that right?', ru:'\n\nВсё верно?', he:'\n\nנכון?' };
    const t=(K[kind]||K.other)[lang]||(K[kind]||K.other).en;
    /* Same vocabulary as relEnds: 'other_parent' means the person just chosen is the
       parent. The sentence must name them in that order or it says the opposite. */
    const themFirst = (kind==='parent') ? (dir==='other_parent') : (dir!=='other_child');
    const a = themFirst ? them : me, b = themFirst ? me : them;
    return t.replace('{a}',a).replace('{b}',b)+(ASK[lang]||ASK.en);
  }

  function relEnds(other,kind,dir){
    /* from_person = PARENT, to_person = CHILD; other kinds keep this person as from_person */
    if(kind==='parent'&&dir==='other_parent') return {from:other,to:PERSON_ID};
    return {from:PERSON_ID,to:other}; }

  async function saveRel(p){ if(!user) return; const L=d();
    /* EVERY edit waits for the keeper - including a keeper's own (Leon, 2026-08-07).
       The old fast-path let a keeper write straight into relationships, and that table
       defaulted status to 'published', so a keeper's connection was live the instant it
       was made and never appeared on the review page. The default is 'in_review' now too,
       so no future path can publish by forgetting to say so. */
    if(true){
      let payload=JSON.stringify({ op:p.relId?'edit':'add', rel_id:p.relId||null, other:p.other||null,
        other_name:p.other_name||'', propose:p.propose||'', kind:p.kind, dir:p.dir, certainty:p.certainty, note:p.note||'', from:p.mode==='me'?'viewer':'facet' });
      /* The same acknowledgement the rest of the app gives: moment-real says "Sent to the
         keeper" for exactly this act, and a contributor who is told nothing cannot tell a
         proposal from a swallowed error. The insert is checked now instead of caught and
         dropped - if it fails, the family hears so. */
      /* Leon proposed the same tie twice within a few minutes and nothing said a word -
         he had declined the first one and reasonably read the second card as the first
         coming back. A proposal that is already waiting is not sent again. */
      try{
        const dup=await sb.from('person_facts').select('id,value').eq('person_id',PERSON_ID)
          .eq('field','kin').eq('status','in_review');
        if(!dup.error && (dup.data||[]).some(r=>{ try{ const k=JSON.parse(r.value);
            return k && k.kind===p.kind && String(k.other||'')===String(p.other||'')
                   && String(k.propose||'').trim().toLowerCase()===String(p.propose||'').trim().toLowerCase(); }
          catch(e){ return false; } })){
          toast(L.alreadyWaiting||'That connection is already waiting for the keeper.');
          return;
        }
      }catch(e){}
      /* A NAME IS NOT A PERSON. When a contributor names someone the forest has never met,
         that person is created FIRST (waiting, like everything else) and the proposal then
         points at their id - not at a loose name. That matters: the keeper's approval
         creates a person when the proposal carries only a name, so filing the name AND
         making the row would have produced two of them, which is exactly how Anna Tihonov
         ended up in the forest twice. Then the contributor is handed that person's own
         empty page, with the tie stated at the top and settled. */
      let newId=null;
      if(!p.other && String(p.propose||'').trim()){
        const nm=String(p.propose).trim();
        const mk=await sb.from('people').insert({created_by:user.id,status:'in_review'})
                   .select('id').single();
        if(mk.error||!mk.data){ toast(L.saveFail||'That could not be sent. Please try again.'); return; }
        newId=mk.data.id;
        try{ const obj=JSON.parse(payload); obj.other=newId; obj.other_name=nm; obj.propose='';
             payload=JSON.stringify(obj); }catch(e){}
      }
      const ins=await sb.from('person_facts').insert({person_id:PERSON_ID,group_id:uuid(),field:'kin',lang:'und',value:payload,ord:0,status:'in_review',created_by:user.id});
      if(ins.error){ toast(L.saveFail||'That could not be sent. Please try again.'); return; }
      toast(L.sent);
      if(newId){
        setTimeout(()=>{ location.href='person-real.html?id='+encodeURIComponent(newId)
          +'&new=1&tie='+encodeURIComponent(p.kind||'other')
          +'&of='+encodeURIComponent((person&&person.display_name)||nameOf(PERSON_ID)||''); }, 900);
      }
      return; }
    const ends=relEnds(p.other,p.kind,p.dir);
    const row={ kind:p.kind, certainty:p.certainty, note:p.note||'' };
    try{
      if(p.relId) await sb.from('relationships').update({...row,from_person:ends.from,to_person:ends.to}).eq('id',p.relId);
      else await sb.from('relationships').insert({from_person:ends.from,to_person:ends.to,...row});
    }catch(e){ /* older schema without kind/certainty/note */
      try{ if(p.relId) await sb.from('relationships').update({from_person:ends.from,to_person:ends.to}).eq('id',p.relId);
        else await sb.from('relationships').insert({from_person:ends.from,to_person:ends.to}); }catch(e2){} } }

  async function removeRel(relId){ if(!relId||!user) return; const r=rels.find(x=>x.id===relId);
    /* the keeper used to cut the tie here and now; that shortcut is gone. A severed
       relationship is the heaviest deletion in the app and it goes through the queue
       like everything else - approving it still materialises the removal. */
    const payload=JSON.stringify({ op:'remove', rel_id:relId, other:r?r.other:null, other_name:r?r.name:'',
      kind:r?r.kind:'other', dir:r?r.dir:'other_child', certainty:r?r.certainty:'remembered', note:'' });
    try{ await sb.from('person_facts').insert({person_id:PERSON_ID,group_id:uuid(),field:'kin',lang:'und',value:payload,ord:0,status:'in_review',created_by:user.id}); }catch(e){} }

  /* keeper approving a kin suggestion materialises the real relationships row */
  async function applyKinPayload(p){
    if(p.op==='remove'&&p.rel_id){ try{ await sb.from('relationships').delete().eq('id',p.rel_id); }catch(e){} return true; }
    if(!p.other) return false;               /* a proposed new person is Leon's to create, not ours */
    const ends=relEnds(p.other,p.kind,p.dir); const row={ kind:p.kind, certainty:p.certainty, note:p.note||'' };
    try{ if(p.op==='edit'&&p.rel_id) await sb.from('relationships').update({...row,from_person:ends.from,to_person:ends.to}).eq('id',p.rel_id);
      else await sb.from('relationships').insert({from_person:ends.from,to_person:ends.to,...row}); }
    catch(e){ try{ if(p.op==='edit'&&p.rel_id) await sb.from('relationships').update({from_person:ends.from,to_person:ends.to}).eq('id',p.rel_id);
      else await sb.from('relationships').insert({from_person:ends.from,to_person:ends.to}); }catch(e2){ return false; } }
    return true; }

  function openAddPart(part){ selectFacet('name'); const card=$('.facet[data-facet="name"]'); if(!card) return;
    const langs=card.querySelector('.np-langs'); const menu=card.querySelector('.np-addmenu'); if(menu) menu.hidden=true;
    /* nickname is a repeatable per-language row, not a single field — use the chip box */
    if(part==='nickname'){ if(langs) langs.hidden=true;
      const box=card.querySelector('.chipadd[data-for="nickname"]');
      if(box){ box.style.display='block'; const i=box.querySelector('input'); if(i){ i.value=''; i.focus(); } } return; }
    if(langs) langs.hidden=false;
    const inp=card.querySelector(`.np-langs [data-field="${part}"][data-lang="${state.lang}"]`); if(inp) inp.focus(); }

  /* ---------- submit ---------- */
  /* READ EVERY FACET BEFORE RELOADING ANY OF THEM.
     This used to reload and toast on its own, and 'sendall' called it five times in a row.
     The first call is for the name facet, which writes nothing at all - but it reloaded, and
     reload() re-renders the page from the database, so every value the contributor had just
     typed anywhere else was wiped out of the DOM before the next call could read it. Places
     then read an empty box, wrote nothing, and said 'Sent to the keeper - thank you',
     because ok only ever flips on a FAILURE and never on nothing-happened. Leon's place of
     birth was lost exactly this way, and so was anything typed into Life in the same visit.
     quiet=true means gather and write, but do not re-render and do not speak; sendall
     reloads once at the end and reports once, honestly. (Leon, 2026-08-14) */
  async function submitFacet(fid,quiet){ if(!user) return true; const card=$(`.facet[data-facet="${fid}"]`); if(!card) return true;
    const read=(f,lg)=>{ const el=card.querySelector(`[data-field="${f}"]${lg?`[data-lang="${lg}"]`:''}`); return el?el.value:null; };
    let ok=true; const put=async(...a)=>{ if(await insFact(...a)===false) ok=false; };
    if(fid==='life'){
      /* ONLY WHAT CHANGED. Every one of these used to be written on every send, whether it
         had been touched or not - so Leon edited one field and the keeper received fresh
         requests for his gender and 'still alive' as well, again and again. His own gender,
         living and birth_prec each carry duplicate published rows written seconds apart from
         exactly this. A request should mean somebody changed something. */
      /* THE ABOUT TEXT, IN THREE LANGUAGES. Write every language the human actually changed as
         their own (ord 0), then translate ONCE from the one they were writing in into the other
         two - skipping any language they typed themselves, here (bioTouched, not yet in `facts`)
         or in the past (the ord=0 lock inside translateInto). The source is the app's language
         if that one changed, else the first language that did. bio is ungrouped: the lock and
         the write key on (field,lang), so grouped:false. */
      let bioSrc=null; const bioTouched=new Set();
      for(const l of LANGS){ const v=read('bio',l);
        if(v!=null&&v.trim()!==''&&v.trim()!==newestVal('bio',l)){ await put('bio',l,v.trim()); bioTouched.add(l);
          if(!bioSrc||l===state.lang) bioSrc={lang:l,text:v.trim()}; } }
      if(bioSrc){ if(await translateInto(PERSON_ID,bioSrc.text,'bio',
          {from:bioSrc.lang,kind:'artefact_body',clean:cleanBio,grouped:false,skip:bioTouched})===false) ok=false; }
      stageOccForm(); if(!await flushOccDrafts()) ok=false;
      const b=read('birth'); if(b!=null&&b!==''&&b!==newestVal('birth','und')) await put('birth','und',b);
      const de=read('death'); if(de!=null&&de!==''&&de!==newestVal('death','und')) await put('death','und',de);
      const seg=card.querySelector('.seg[data-field="birth_prec"] .on');
      if(seg && seg.getAttribute('data-v')!==(newestVal('birth_prec','und')||S.life.birth_prec||'exact')) await put('birth_prec','und',seg.getAttribute('data-v'));
      const liv=card.querySelector('.sw[data-field="living"]');

      const gseg=card.querySelector('.seg[data-field="gender"] .on'); const gval=gseg?(gseg.getAttribute('data-v')||''):'';

         not reading the fact at all. pbirth and country already guard against this.

      if(gval && gval!==(newestVal('gender','und')||S.life.gender)) await put('gender','und',gval);
    } else if(fid==='places'){
      if(!await flushHomeDrafts()) ok=false;
      const g=pbGroup(); const gid=g.gid||uuid();
      const pb=(read('pbirth')||'').trim(), pc=(read('pbirth_country')||'').trim();
      /* only what actually changed - writing an unchanged value breeds a duplicate row */
      if(pb&&pb!==g.place) await put('pbirth','und',pb,0,gid);

  /* THE PAGE'S SEND NEVER WROTE NAMES. submitFacet knows only 'life' and 'places', so the
     loop over all five facets quietly did nothing for the name one - names were saved
     ONLY by the button inside the name editor. Removing that button as redundant would
     have stopped name editing working altogether, silently. It is folded in properly
     now: quiet when the page is sending everything, and it speaks for itself otherwise. */
  async function submitName(quiet){ if(!user) return true; const card=$('.facet[data-facet="name"]'); if(!card) return true;
    const read=(f,l)=>{ const el=card.querySelector(`.np-langs [data-field="${f}"][data-lang="${l}"]`); return el?el.value.trim():null; };
    let ok=true;
    /* name parts are person_facts ROWS — name_variants is retiring, do not write to it */
    /* NAMES CROSS THE ALPHABET (Leon, 2026-08-20). A name typed in English showed a
       Hebrew reader Latin letters, on every card, every game and every tie - the most-seen
       text in the app and the last of it left untranslated. It goes through the function's
       own 'name_full' path with the person's gender, not the prose path: a name is carried
       across an alphabet, not translated, and cleanTr is right here precisely because a name
       IS one short line. The source rule and the lock apply as everywhere else - correct the
       Russian spelling of a surname by hand and it is yours for good. */
    const gsex=({f:'f',m:'m'})[S.life.gender]||null;
    const changed=[];
    for(const f of ['given','family','called','maiden','patronymic','honorific']){
      for(const l of LANGS){ const v=read(f,l);
        if(v&&v!==((NAME[f]||{})[l]||'')){
          if(await insFact(f,l,v)===false) ok=false; else changed.push({f:f,l:l,v:v}); } } }
    for(const c of changed){
      if(await translateInto(PERSON_ID,c.v,c.f,
           {from:c.l,kind:'name_full',clean:cleanTr,grouped:false,gender:gsex})===false) ok=false; }
    if(!quiet){ await reload(); if(ok) toast(d().sent); }
    return ok; }

  /* ---------- keeper: per-field approve / decline (Rule 3) ---------- */
  async function approveRef(ref){ if(!user) return; const [kind,id]=ref.split(':'); const now=new Date().toISOString();
    if(kind==='remreq'){ const req=facts.find(x=>x.id===id);
      if(req){ try{ await sb.from('person_facts').delete().eq('id',req.value); }catch(e){}
        try{ await sb.from('person_facts').delete().eq('id',id); }catch(e){} }
      await reload(); toast(d().approve+' ✓'); return; }
    if(kind==='fact'){ const f=facts.find(x=>x.id===id);
      if(f&&f.field==='kin'){ const p=parseKin(f.value);
        if(p){ await applyKinPayload(p); try{ await sb.from('person_facts').delete().eq('id',id); }catch(e){}
          await reload(); toast(d().approve+' ✓'); return; } }
      if(f){ const patch={};
        if(f.field==='birth')patch.birth_date=f.value||null; if(f.field==='death')patch.death_date=f.value||null;
        if(f.field==='birth_prec')patch.birth_certainty=({exact:'documented',month:'remembered',year:'remembered',circa:'uncertain',unknown:'uncertain'})[f.value]||null; if(f.field==='living')patch.is_living=(f.value==='1');
        if(f.field==='gender')patch.sex=({f:'female',m:'male'})[f.value]||null;   /* words, not letters */ if(f.field==='face'){ try{ const fv=JSON.parse(f.value); patch.primary_asset=fv.storage_path;
          /* A HUMAN'S FRAMING OUTRANKS A DETECTOR'S GUESS. A face fact carries both the
             tagger's detection box AND the zoom/px/py a person set by hand; this read the
             box FIRST, so Leon's deliberate framing was thrown away on approval and the
             person page drew the detector's rectangle while the editor reopened his - the
             same portrait wrong in one place and right in the other. Gold is human-entered:
             if someone framed it, that is the portrait. */
          /* THE EXACT BOX IS THE FRAMING. When the crop stage was rebuilt over the whole
             photograph, px/py changed meaning - they are fractions of the WHOLE image now,
             not a position inside its centred square - but this still preferred them, and
             zoomToPx reads them with the old ruler. So Leon framed correctly, approved, and
             the page drew somewhere else again. The box carries the human's framing in whole-
             image fractions; the stage numbers are legacy and only used when there is no box. */
          const fb=(fv.box&&(fv.box.w>0))?fv.box:((fv.zoom!=null)?{zoom:fv.zoom,px:fv.px,py:fv.py}:null);
          if(fb) patch.metadata=Object.assign({},(person&&person.metadata)||{},{face_box:fb}); 
            /* Bake the portrait HERE - inside the block where fv and the chosen box exist.
               My first attempt put this call outside it, wrapped in try/catch, so it threw a
               ReferenceError on names that were not in scope and did nothing, quietly: the
               framing was approved and no picture was made. Silent failure, in the code
               written to end silent failures, again. */
            try{ if(window.LFPortrait && fv && fv.storage_path)
                   await LFPortrait.bake(sb, PERSON_ID, fv.storage_path, fb); }catch(e){}
          }catch(e){} }
        if(Object.keys(patch).length){ try{ await sb.from('people').update(patch).eq('id',PERSON_ID); }catch(e){} }
        /* one published part per (person,lang,field): supersede the old one BEFORE publishing this,
           else person_facts_one_published_name_part rejects the update. Keeper DELETE is allowed by RLS;
           the new value is already safely stored, so this cannot lose data. */
        const NAMEPARTS=['given','family','patronymic','maiden','called','honorific'];
        if(NAMEPARTS.includes(f.field)){ try{ await sb.from('person_facts').delete().eq('person_id',PERSON_ID).eq('lang',f.lang).eq('field',f.field).eq('status','published'); }catch(e){} }
        /* one portrait per person: publishing this face supersedes every other face row (older published crops AND stale pending suggestions) */
        if(f.field==='face'){ try{ await sb.from('person_facts').delete().eq('person_id',PERSON_ID).eq('field','face').neq('id',id); }catch(e){} }
        try{ await sb.from('person_facts').update({status:'published',reviewed_by:user.id,published_at:now}).eq('id',id); }catch(e){} } }
    /* 'nv' approvals went with name_variants */
    else if(kind==='group'){ const NP2=['given','family','patronymic','maiden','called','honorific'];
      for(const ff of facts.filter(x=>x.group_id===id&&x.status!=='published')) {
        if(NP2.includes(ff.field)){ try{ await sb.from('person_facts').delete().eq('person_id',PERSON_ID).eq('lang',ff.lang).eq('field',ff.field).eq('status','published').neq('id',ff.id); }catch(e){} }
        try{ await sb.from('person_facts').update({status:'published',reviewed_by:user.id,published_at:now}).eq('id',ff.id); }catch(e){} } }
    else if(kind==='artefact'){ try{ await sb.from('artefacts').update({status:'published',reviewed_by:user.id}).eq('id',id); }catch(e){} }
    await reload(); toast(d().approve+' ✓'); }
  async function declineRef(ref){ const [kind,id]=ref.split(':');

  /* ---------- atmosphere (growing vines) ---------- */
  function atmosphere(canvas){ const ctx=canvas.getContext('2d'); let W,H,DPR=Math.min(2,window.devicePixelRatio||1);
    const COL=[[143,214,160],[243,205,132],[127,180,216],[201,162,255]]; let items=[];
    function build(){ items=[]; const k=Math.max(3,Math.round(W/120));
      for(let i=0;i<k;i++){ const pts=[]; let x=(i+.5)/k+(Math.random()-.5)*.12, y=1.05, ang=-Math.PI/2+(Math.random()-.5)*.4; const n=(Math.random()*5|0)+7;
        for(let j=0;j<n;j++){ pts.push({x,y}); ang+=(Math.random()-.5)*.6; const st=.07+Math.random()*.05; x+=Math.cos(ang)*st*.5; y+=Math.sin(ang)*st; }
        items.push({pts, c:COL[Math.random()*COL.length|0], grow:0, gspd:.0009+Math.random()*.0008, sway:Math.random()*6.28, buds:pts.map(()=>Math.random()>.55)}); } }
    function resize(){ W=canvas.clientWidth; H=canvas.clientHeight; canvas.width=W*DPR; canvas.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); build(); }
    new ResizeObserver(resize).observe(canvas); resize();
    function frame(now){ const t=(now||0)/1000; ctx.clearRect(0,0,W,H); ctx.globalCompositeOperation='lighter';
      items.forEach(v=>{ if(!reduceMotion&&v.grow<1) v.grow+=v.gspd; const g=reduceMotion?1:v.grow, seg=(v.pts.length-1)*g, last=Math.floor(seg), frac=seg-last;
        const P=k=>({x:(v.pts[k].x+(reduceMotion?0:Math.sin(t*.2+k*.5+v.sway)*.006*(k/v.pts.length)))*W, y:v.pts[k].y*H});
        ctx.strokeStyle=`rgba(${v.c[0]},${v.c[1]},${v.c[2]},.16)`; ctx.lineWidth=1.4; ctx.beginPath();
        for(let i=0;i<=last;i++){ const p=P(i); i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y); }
        if(last<v.pts.length-1){ const a=P(last),b=P(last+1); ctx.lineTo(a.x+(b.x-a.x)*frac,a.y+(b.y-a.y)*frac); } ctx.stroke();
        for(let i=0;i<=last;i++){ if(!v.buds[i])continue; const p=P(i); const tw=reduceMotion?.7:.4+.6*(.5+.5*Math.sin(t*1.2+i+v.sway)); const R=6+(i===v.pts.length-1?4:0);
          const gr=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,R); gr.addColorStop(0,`rgba(${v.c[0]},${v.c[1]},${v.c[2]},${.5*tw})`); gr.addColorStop(1,`rgba(${v.c[0]},${v.c[1]},${v.c[2]},0)`);
          ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(p.x,p.y,R,0,6.283); ctx.fill();
          ctx.fillStyle=`rgba(255,250,236,${.7*tw})`; ctx.beginPath(); ctx.arc(p.x,p.y,1.3,0,6.283); ctx.fill(); } });
      ctx.globalCompositeOperation='source-over'; if(!reduceMotion) requestAnimationFrame(frame); }
    if(!reduceMotion) requestAnimationFrame(frame); else frame(0);
  }

  /* ---------- reload + gate + boot ---------- */
  async function reload(){ await loadData();
    try{ if(window.LFDB&&LFDB.places) PLMAP=await LFDB.places(sb,state.lang); }catch(e){}
    seed(); render(); }
  function showGate(){ const L=d(); let g=$('#gate'); if(!g){ g=document.createElement('div'); g.id='gate'; $('#dev').appendChild(g); }
    g.setAttribute('style','position:absolute;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(4,7,14,.9);backdrop-filter:blur(6px)');
    g.innerHTML=`<div style="width:100%;max-width:320px;background:linear-gradient(180deg,#0e1c31,#081120);border:1px solid var(--hair);border-radius:20px;padding:24px;text-align:center">
      <h3 style="font-family:'Newsreader',serif;font-weight:400;font-size:22px;color:#fbf5e8">${esc(L.eyebrow)}</h3>
      <div style="font-size:12.5px;color:var(--muted);margin:6px 0 16px">${esc(L.keeper)}</div>
      <input id="gEmail" type="email" placeholder="you@example.com" style="width:100%;margin-bottom:10px;background:rgba(6,14,26,.7);border:1px solid var(--hair);border-radius:12px;padding:12px;color:var(--cream);font-family:inherit;font-size:14px">
      <input id="gPass" type="password" placeholder="••••••••" style="width:100%;margin-bottom:12px;background:rgba(6,14,26,.7);border:1px solid var(--hair);border-radius:12px;padding:12px;color:var(--cream);font-family:inherit;font-size:14px">
      <button id="gBtn" class="btn violet" style="width:100%">${esc(L.signin)}</button>
      <div id="gErr" style="color:#ff9a8a;font-size:12px;min-height:16px;margin-top:8px"></div></div>`;
    $('#gBtn').onclick=async()=>{ const {error}=await sb.auth.signInWithPassword({email:$('#gEmail').value.trim(),password:$('#gPass').value}); if(error){ $('#gErr').textContent=error.message; return; } g.remove(); boot(); };
  }
  async function boot(){ const {data:{session}}=await sb.auth.getSession();
    const stored=localStorage.getItem('lf_lang'); if(stored&&T[stored]) state.lang=stored; else { const dl=(navigator.language||'en').slice(0,2); if(T[dl]) state.lang=dl; }
    if(!session){ render(); showGate(); return; }
    user=session.user;
    try{ const {data:pr}=await sb.from('profiles').select('is_keeper,preferred_lang').eq('id',user.id).maybeSingle(); if(pr){ state.keeper=!!pr.is_keeper; if(state.keeper){ window.__lfKeeper=true; try{document.dispatchEvent(new Event('lf-keeper-ready'));}catch(e){} } if(pr.preferred_lang&&!stored&&T[pr.preferred_lang]) state.lang=pr.preferred_lang; } }catch(e){}
    /* Draw the ring BEFORE the data arrives, so the face has somewhere to land the moment
       it is fetched. Measured: the portrait was ready at 718ms and waited until 1766ms
       purely because #faceHost did not exist yet. The shell costs nothing - it is the same
       placeholder the page shows anyway - and every real value overwrites it on render(). */
    try{ render(); }catch(e){}
    await loadData(); seed(); render();
  }
  atmosphere($('#dev .atmo')); wireOnce(); boot();
})();
