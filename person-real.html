<style>
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ background:#04070e; }
  :root{
    --cream:#f4ecdb; --muted:#9db0cc; --dim:#6f83a3; --hair:#ffffff18; --panel:#ffffff0b;
    --gold:#f3cd84; --gold-hi:#ffe6ad; --cool:#7fb4d8; --cool-hi:#a9d2ee;
    --edit:#c9a2ff; --edit-hi:#ddc6ff; --edit-soft:#efe6ff; --leaf:#8fd6a0;
  }
  body{ font-family:'Hanken Grotesk',system-ui,sans-serif; color:var(--cream); min-height:100dvh;
    display:flex; align-items:flex-start; justify-content:center; gap:40px; padding:34px 20px 90px;
    background:radial-gradient(150% 100% at 50% -6%, #12233c 0%, #0a1526 44%, #04070e 100%);
    -webkit-user-select:none; user-select:none; flex-wrap:wrap; }
  .serif{ font-family:'Newsreader',Georgia,serif; }
  .mono{ font-family:'Azeret Mono',monospace; }
  .screen[dir="rtl"] .serif,
  .screen[dir="rtl"] .inp,
  .screen[dir="rtl"] .name-input{ font-family:'Frank Ruhl Libre','Newsreader',serif; }

  /* ===== device ===== */
  .stagewrap{ display:flex; flex-direction:column; align-items:center; gap:14px; }
  .device{ position:relative; width:min(390px,100vw); height:820px; border-radius:42px; overflow:hidden; flex:0 0 auto;
    background:#04070e; box-shadow:0 40px 120px -50px #000, 0 0 0 9px #14141b, 0 0 0 10px #2b2b34; }

  .atmo{ position:absolute; inset:0; z-index:0; width:100%; height:100%; }
  .atmo-veil{ position:absolute; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(120% 70% at 50% 6%, rgba(143,214,160,.07), transparent 42%),
      radial-gradient(120% 92% at 50% 42%, transparent 30%, rgba(4,7,14,.6) 100%); }
  .screen{ position:absolute; inset:0; z-index:2; overflow-y:auto; scrollbar-width:none; }
  .screen::-webkit-scrollbar{ display:none; }
  .pad{ padding:0 20px calc(46px + env(safe-area-inset-bottom)); }

  /* ===== top bar ===== */
  .topbar{ position:sticky; top:0; z-index:14; display:flex; align-items:center; gap:10px;
    padding:15px 18px 11px; background:linear-gradient(to bottom, rgba(5,9,17,.9), rgba(5,9,17,.45) 68%, transparent);
    backdrop-filter:blur(7px); }
  .ibtn{ width:40px; height:40px; border-radius:12px; flex:0 0 auto; display:grid; place-items:center; cursor:pointer;
    border:1px solid var(--hair); background:rgba(10,20,34,.55); color:var(--cream); transition:border-color .2s,background .2s; }
  .ibtn:hover{ border-color:rgba(255,255,255,.34); }
  .ibtn:focus-visible{ outline:2px solid var(--cool-hi); outline-offset:2px; }
  .ibtn svg{ width:18px; height:18px; }
  .ttl{ flex:1; min-width:0; text-align:center; }
  .ttl .k{ font-family:'Azeret Mono',monospace; font-size:9px; letter-spacing:.24em; text-transform:uppercase; color:var(--muted); }
  .ttl .n{ font-family:'Newsreader',serif; font-size:17px; color:#fbf5e8; margin-top:1px; }

  /* keeper reassurance ribbon */
  .keeper-note{ display:flex; align-items:center; gap:9px; margin:2px 18px 0; padding:9px 13px; border-radius:11px;
    background:rgba(201,162,255,.08); border:1px solid rgba(201,162,255,.26); }
  .keeper-note svg{ width:15px; height:15px; color:var(--edit); flex:0 0 auto; }
  .keeper-note span{ font-size:11.5px; color:#cbbce6; line-height:1.35; }

  /* ===== HERO (variant A: face + ring anchor-map) ===== */
  .hero{ position:relative; margin:30px auto 6px; width:308px; height:308px; }
  .ring-svg{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; z-index:1; pointer-events:none; }
  .facewrap{ position:absolute; inset:84px; z-index:3; border-radius:50%; }
  .face{ width:100%; height:100%; border-radius:50%; overflow:hidden; position:relative;
    border:1px solid rgba(255,244,214,.9);
    box-shadow:0 0 28px -2px rgba(255,232,180,.6), 0 0 78px -14px rgba(243,205,132,.45), inset 0 0 0 4px rgba(4,7,14,.6); }
  .face svg, .face img{ width:100%; height:100%; object-fit:cover; display:block; }
  .face .changef{ position:absolute; inset-inline-end:8px; inset-block-end:8px; z-index:4; width:38px; height:38px; border-radius:50%;
    display:grid; place-items:center; cursor:pointer; color:#1a0f2e; border:2px solid #04070e;
    background:linear-gradient(180deg,var(--edit-hi),var(--edit)); box-shadow:0 4px 12px -2px #000; }
  .face .changef svg{ width:18px; height:18px; }
  .hero .who{ position:absolute; z-index:4; inset-inline:0; bottom:-30px; text-align:center; pointer-events:none; }
  .hero .who .nm{ font-family:'Newsreader',serif; font-size:26px; color:#fbf5e8; }
  .hero .who .nm em{ font-style:italic; }

  /* ring beads = the 8 facet icons */
  .cat{ position:absolute; z-index:5; width:56px; transform:translate(-50%,-50%); text-align:center; cursor:pointer;
    background:none; border:none; color:inherit; }
  .cat .bead{ width:48px; height:48px; margin:0 auto; border-radius:50%; display:grid; place-items:center; position:relative;
    background:rgba(12,22,38,.72); border:1px solid var(--hair); backdrop-filter:blur(4px);
    transition:transform .22s cubic-bezier(.16,.8,.28,1), border-color .22s, box-shadow .22s; }
  .cat .bead svg{ width:21px; height:21px; color:var(--gold-hi); position:relative; z-index:2; }
  .cat.cool .bead svg{ color:var(--cool-hi); }
  .cat .lab{ font-family:'Azeret Mono',monospace; font-size:8px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--muted); margin-top:6px; line-height:1.1; }
  /* kindling glow driven by --k (0..1) */
  .cat .bead::after{ content:""; position:absolute; inset:-3px; border-radius:50%; opacity:calc(var(--k) * .95);
    box-shadow:0 0 calc(6px + var(--k)*16px) calc(var(--k)*3px) rgba(243,205,132,.55); }
  .cat.cool .bead::after{ box-shadow:0 0 calc(6px + var(--k)*16px) calc(var(--k)*3px) rgba(127,180,216,.55); }
  .cat .bead{ border-color:rgba(243,205,132,calc(.18 + var(--k)*.5)); }
  .cat.cool .bead{ border-color:rgba(127,180,216,calc(.18 + var(--k)*.5)); }
  .cat:hover .bead, .cat.on .bead{ transform:scale(1.1); }
  .cat.on .bead{ background:rgba(243,205,132,.18); }
  .cat.cool.on .bead{ background:rgba(127,180,216,.18); }
  .cat:focus-visible .bead{ outline:2px solid var(--gold-hi); outline-offset:3px; }
  /* play marker for facets that hold a game */
  .cat .play{ position:absolute; bottom:-2px; inset-inline-end:-1px; width:16px; height:16px; border-radius:50%; z-index:3;
    display:grid; place-items:center; background:linear-gradient(180deg,#101d31,#0a1420); border:1px solid rgba(243,205,132,.55); }
  .cat .play svg{ width:8px; height:8px; color:var(--gold-hi); }
  /* pending violet pin */
  .cat .pin{ position:absolute; top:-1px; inset-inline-start:0; width:13px; height:13px; border-radius:50%; z-index:3;
    background:var(--edit); border:2px solid #04070e; }

  /* ===== facet card (shared) ===== */
  .facets{ margin-top:34px; display:flex; flex-direction:column; gap:16px; }
  .facet{ border:1px solid var(--hair); border-radius:18px; background:rgba(9,17,29,.5); overflow:hidden;
    scroll-margin-top:14px; }
  .facet.b{ border:none; border-radius:16px; background:rgba(9,17,29,.44); }
  .fhead{ display:flex; align-items:center; gap:11px; padding:15px 16px 12px; }
  .fhead .fic{ width:36px; height:36px; border-radius:11px; display:grid; place-items:center; flex:0 0 auto;
    background:rgba(243,205,132,.12); border:1px solid rgba(243,205,132,.3); }
  .fhead .fic svg{ width:18px; height:18px; color:var(--gold-hi); }
  .fhead.cool .fic{ background:rgba(127,180,216,.12); border-color:rgba(127,180,216,.3); }
  .fhead.cool .fic svg{ color:var(--cool-hi); }
  .fhead .ft{ flex:1; min-width:0; }
  .fhead .ft .h{ font-family:'Newsreader',serif; font-size:20px; color:#fbf5e8; line-height:1.1; }
  .fhead .ft .s{ display:inline-flex; align-items:center; gap:6px; font-size:11px; color:var(--muted); margin-top:2px; }
  .fhead .ft .s .src-dot{ width:6px; height:6px; border-radius:50%; }
  .fbody{ padding:0 16px 17px; }

  /* fields */
  .field{ margin-bottom:13px; }
  .field > label{ display:block; font-family:'Azeret Mono',monospace; font-size:9px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--muted); margin-bottom:7px; }
  .inp{ width:100%; background:rgba(8,16,28,.66); border:1px solid var(--hair); border-radius:12px; padding:12px 13px;
    color:var(--cream); font-family:'Newsreader',serif; font-size:16px; transition:border-color .2s; }
  .inp:focus{ outline:none; border-color:rgba(243,205,132,.55); }
  .inp::placeholder{ color:#5f7089; }
  textarea.inp{ resize:vertical; line-height:1.5; min-height:78px; }
  .empty-inp{ border-style:dashed; border-color:rgba(243,205,132,.3); color:#8fa0ba; }

  .mlrow{ display:flex; align-items:center; gap:8px; }
  .mlrow .inp{ flex:1; }
  .mladd{ flex:0 0 auto; height:44px; padding:0 11px; border-radius:11px; cursor:pointer; display:flex; align-items:center; gap:6px;
    background:rgba(243,205,132,.1); border:1px solid rgba(243,205,132,.32); color:var(--gold-hi);
    font-family:'Azeret Mono',monospace; font-size:11px; }
  .mladd svg{ width:15px; height:15px; }
  .mlvars{ margin-top:9px; display:none; flex-direction:column; gap:8px; padding-inline-start:12px;
    border-inline-start:2px solid rgba(243,205,132,.25); }
  .mlvars.open{ display:flex; }
  .mlvar{ display:flex; align-items:center; gap:9px; }
  .mlvar .tag{ font-family:'Azeret Mono',monospace; font-size:9px; letter-spacing:.1em; color:var(--gold);
    width:24px; flex:0 0 auto; text-transform:uppercase; }
  .mlvar .inp{ font-size:14px; padding:9px 11px; }
  .mlvar.rtl .inp{ direction:rtl; text-align:right; }
  .autotr{ display:inline-flex; align-items:center; gap:6px; margin-top:7px; font-size:10.5px; color:#9a8bbd;
    font-family:'Azeret Mono',monospace; letter-spacing:.04em; }
  .autotr svg{ width:12px; height:12px; }
  .autotr b{ color:var(--gold); font-weight:500; cursor:pointer; }

  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{ display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:99px;
    background:rgba(243,205,132,.09); border:1px solid rgba(243,205,132,.3); font-size:13.5px; color:var(--cream);
    font-family:'Newsreader',serif; }
  .chip .x{ width:15px; height:15px; color:var(--muted); cursor:pointer; }
  .chip.add{ background:transparent; border-style:dashed; border-color:var(--hair); color:var(--muted); cursor:pointer; font-family:'Hanken Grotesk',sans-serif; font-size:12.5px; }
  .chip.add:hover{ border-color:rgba(243,205,132,.5); color:var(--gold-hi); }
  .chip.cool{ background:rgba(127,180,216,.09); border-color:rgba(127,180,216,.3); }
  .chip.pending{ background:rgba(201,162,255,.1); border-color:rgba(201,162,255,.4); color:var(--edit-hi); }
  .chip .ord{ font-family:'Azeret Mono',monospace; font-size:9px; color:var(--cool); }

  .row2{ display:flex; gap:10px; } .row2 > *{ flex:1; }
  .seg{ display:flex; gap:5px; background:rgba(8,16,28,.6); border:1px solid var(--hair); border-radius:11px; padding:4px; }
  .seg button{ flex:1; border:none; background:transparent; color:var(--muted); cursor:pointer; padding:8px 4px; border-radius:8px;
    font-family:'Hanken Grotesk',sans-serif; font-size:11px; transition:background .18s,color .18s; }
  .seg button.on{ background:rgba(127,180,216,.18); color:var(--cool-hi); }
  .seg.gold button.on{ background:rgba(243,205,132,.18); color:var(--gold-hi); }
  .toggle{ display:flex; align-items:center; gap:10px; }
  .sw{ width:42px; height:24px; border-radius:99px; background:rgba(255,255,255,.12); position:relative; cursor:pointer; transition:background .2s; flex:0 0 auto; }
  .sw::after{ content:""; position:absolute; top:2px; inset-inline-start:2px; width:20px; height:20px; border-radius:50%; background:#dfe7f2; transition:transform .2s; }
  .sw.on{ background:rgba(127,180,216,.5); } .sw.on::after{ transform:translateX(18px); }
  .screen[dir="rtl"] .sw.on::after{ transform:translateX(-18px); }
  .hint{ font-size:11.5px; color:var(--muted); margin-top:8px; line-height:1.45; }

  /* pending + keeper */
  .pending{ display:inline-flex; align-items:center; gap:8px; margin-top:11px; padding:8px 12px; border-radius:11px;
    background:rgba(201,162,255,.1); border:1px solid rgba(201,162,255,.34); font-size:11.5px; color:var(--edit-hi); }
  .pending .sp{ width:11px; height:11px; border-radius:50%; border:2px solid rgba(201,162,255,.35); border-top-color:var(--edit); animation:spin 1s linear infinite; flex:0 0 auto; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .keeperbar{ display:flex; align-items:center; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .kbtn{ display:inline-flex; align-items:center; gap:6px; padding:8px 12px; border-radius:9px; cursor:pointer; font-size:12px; font-weight:600;
    font-family:'Hanken Grotesk',sans-serif; border:1px solid transparent; }
  .kbtn.ok{ background:rgba(143,214,160,.16); border-color:rgba(143,214,160,.4); color:#a9e6ba; }
  .kbtn.no{ background:transparent; border-color:var(--hair); color:var(--muted); }
  .kbtn svg{ width:13px; height:13px; }
  .pendrow{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin:8px 0; }

  /* story memories */
  .memory{ padding:13px 14px; border-radius:14px; background:rgba(243,205,132,.05); border:1px solid rgba(243,205,132,.16); margin-bottom:10px; }
  .memory .words{ font-family:'Newsreader',serif; font-style:italic; font-weight:300; font-size:15px; line-height:1.5; color:#f6ecd7; }
  .memory .told{ margin-top:10px; display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--gold); }
  .memory .told .flame{ width:6px; height:6px; border-radius:50%; background:var(--gold); box-shadow:0 0 8px 1px var(--gold); }
  .memory .told b{ font-weight:600; }
  .memory .stepin{ margin-top:11px; display:inline-flex; align-items:center; gap:7px; font-size:12.5px;
    color:var(--gold); text-decoration:none; border:1px solid rgba(243,205,132,.3); border-radius:11px;
    padding:7px 12px; background:rgba(243,205,132,.06); }
  .memory .stepin:after{ content:"\2192"; }
  [dir="rtl"] .memory .stepin:after{ content:"\2190"; }
  .invite{ padding:14px; border-radius:14px; border:1px dashed rgba(243,205,132,.32); background:rgba(243,205,132,.04); }
  .invite .words{ font-family:'Newsreader',serif; font-style:italic; font-size:14px; line-height:1.5; color:#efe0c2; }
  .invite .cta{ margin-top:9px; font-size:12px; color:var(--gold); font-weight:600; display:inline-flex; align-items:center; gap:6px; cursor:pointer; }

  /* cool app-assembled note */
  .appfact{ margin-top:12px; border-top:1px solid var(--hair); padding-top:12px; display:flex; align-items:flex-start; gap:11px; }
  .appfact .mark{ width:22px; height:22px; border-radius:6px; flex:0 0 auto; display:grid; place-items:center;
    background:rgba(127,180,216,.12); border:1px solid rgba(127,180,216,.3); }
  .appfact .mark svg{ width:12px; height:12px; color:var(--cool); }
  .appfact .body{ font-size:12.5px; line-height:1.5; color:var(--cool); }
  .appfact .body .src{ display:block; margin-top:4px; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:rgba(127,180,216,.55); font-family:'Azeret Mono',monospace; }

  /* game strip */
  .games{ margin-top:13px; display:flex; flex-direction:column; gap:9px; }
  .game{ display:flex; align-items:center; gap:12px; padding:12px 13px; border-radius:14px; cursor:pointer;
    background:linear-gradient(120deg, rgba(243,205,132,.1), rgba(127,180,216,.05)); border:1px solid rgba(243,205,132,.26);
    transition:border-color .2s, transform .2s; }
  .game:hover{ border-color:rgba(243,205,132,.5); transform:translateY(-1px); }
  .game .gic{ width:38px; height:38px; border-radius:11px; flex:0 0 auto; display:grid; place-items:center;
    background:rgba(4,7,14,.5); border:1px solid rgba(243,205,132,.3); color:var(--gold-hi); }
  .game .gic svg{ width:18px; height:18px; }
  .game .gt{ flex:1; min-width:0; }
  .game .gt .gn{ font-family:'Newsreader',serif; font-size:16px; color:#fbf5e8; }
  .game .gt .gs{ font-size:11.5px; color:var(--muted); margin-top:1px; }
  .game .go{ font-family:'Azeret Mono',monospace; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:#0c1220;
    background:linear-gradient(180deg,var(--gold-hi),var(--gold)); padding:8px 11px; border-radius:99px; font-weight:600; flex:0 0 auto; }
  .game.locked{ background:rgba(255,255,255,.03); border-color:var(--hair); border-style:dashed; cursor:default; }
  .game.locked:hover{ transform:none; border-color:var(--hair); }
  .game.locked .gic{ color:var(--muted); border-color:var(--hair); }
  .game.locked .gt .gn{ color:var(--muted); }
  .game.locked .go{ background:transparent; color:var(--muted); border:1px solid var(--hair); }

  /* face facet gallery */
  .tagstrip{ display:flex; gap:9px; overflow-x:auto; margin:0 -16px; padding:2px 16px 8px; scrollbar-width:none; }
  .tagstrip::-webkit-scrollbar{ display:none; }
  .tagshot{ flex:0 0 auto; width:88px; }
  .tagshot .im{ width:88px; height:88px; border-radius:12px; overflow:hidden; border:1px solid var(--hair); position:relative; }
  .tagshot .im svg, .tagshot .im img{ width:100%; height:100%; object-fit:cover; }
  .tagshot .im .box{ position:absolute; border:1.5px solid var(--gold-hi); border-radius:4px; }
  .tagshot .cap2{ font-size:10.5px; color:var(--muted); margin-top:5px; text-align:center; font-family:'Newsreader',serif; }

  /* reel reward */
  .reel{ position:relative; padding:16px; border-radius:16px; overflow:hidden;
    background:linear-gradient(120deg, rgba(127,180,216,.1), rgba(243,205,132,.06)); border:1px solid rgba(127,180,216,.3); }
  .reel .rrow{ display:flex; align-items:center; gap:14px; }
  .reel .rimg{ width:58px; height:58px; border-radius:14px; overflow:hidden; flex:0 0 auto; border:1px solid var(--hair); }
  .reel .rimg svg{ width:100%; height:100%; }
  .reel .rt{ flex:1; } .reel .rt .rn{ font-family:'Newsreader',serif; font-size:18px; color:#fbf5e8; }
  .reel .rt .rs{ font-size:12px; color:var(--muted); margin-top:2px; line-height:1.4; }
  .reel .rgo{ font-family:'Azeret Mono',monospace; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:#0c1220;
    background:linear-gradient(180deg,#a9d0ec,#7fb4d8); padding:9px 12px; border-radius:99px; font-weight:600; flex:0 0 auto; }
  .reel .bar{ margin-top:13px; height:6px; border-radius:99px; background:rgba(255,255,255,.1); overflow:hidden; }
  .reel .bar i{ display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,var(--gold),var(--cool)); }
  .reel .barlab{ margin-top:8px; font-size:11px; color:var(--muted); }

  .adddetail{ margin-top:6px; }
  .adddetail .plus{ width:100%; display:flex; align-items:center; justify-content:center; gap:9px; padding:13px; border-radius:14px;
    background:rgba(201,162,255,.07); border:1px dashed rgba(201,162,255,.4); color:var(--edit-hi); cursor:pointer;
    font-family:'Newsreader',serif; font-size:15px; }
  .adddetail .plus svg{ width:18px; height:18px; }
  .detailrow{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; padding:12px 13px; border-radius:12px;
    background:rgba(243,205,132,.07); border:1px solid rgba(243,205,132,.24); margin-bottom:9px; }

  function clearReq(field){ return facts.find(x=>x.field==='clear_request'&&x.status!=='published'&&x.value===field)||null; }
  function clearCtl(col){ const L=d();

    const hasCol=person&&person[col]!=null&&person[col]!=='';

  /* ---------- storage / face crop ---------- */
  async function signedUrl(path,width){ if(!path) return ''; try{ const opts=width?{transform:{width:width,resize:'contain'}}:undefined; const r=await sb.storage.from('family').createSignedUrl(path,3600,opts); if(r.data&&r.data.signedUrl) return r.data.signedUrl; }catch(e){} if(width){ try{ const r2=await sb.storage.from('family').createSignedUrl(path,3600); return (r2.data&&r2.data.signedUrl)||''; }catch(e){} } return ''; }
  async function faceInto(el, path, box){ if(!el||!path) return;
    /* If the portrait is already on screen, leave it alone. faceFirst puts it up early and

       gain: the only honest thing to do is nothing. */

  /* ---------- write helpers (EVERY write lands as an in_review suggestion) ---------- */
  /* RLS pf_insert only permits status IN ('draft','in_review') with created_by=auth.uid().
     Inserting a 'published' row is silently rejected — and pre-deleting the old published
     part first would then lose data. So NO write ever inserts published and NO write pre-deletes:
     keeper edits go through Review too, where approving publishes (Leon confirmed). Returns
     true on success, false on failure (surfaces a toast — never fails invisibly). */
  async function insFact(field,lg,value,ord,group_id){ if(!user) return false;
    const row={person_id:PERSON_ID,group_id:group_id||uuid(),field,lang:lg||'und',value:value==null?'':String(value),ord:ord||0,
      status:'in_review',created_by:user.id};

  /* facts that also live as people columns (birth/death/gender/face) are synced at APPROVAL

  async function delFact(id){ try{ await sb.from('person_facts').delete().eq('id',id); }catch(e){} }
  /* delete if the gate allows it; otherwise ask the keeper (per-row, Rule 3) */
  async function removeRow(id){ const row=facts.find(x=>x.id===id); if(!row) return;

    else if(!removalReq(id)){ if(await insFact('remove_request','und',id)) toast(d().removeAsked); }

  /* ---------- load ---------- */

  /* THE FACE GOES UP FIRST.
     Measured: the portrait appeared 1.8s after opening a person page, not because the image
     is slow - it is 25KB - but because it queued behind six sequential queries. A person's
     own face should never wait on their tagged photographs or their pending edits. This asks
     for one column, paints it the moment it lands, and lets the rest of the page load behind
     it. If it loses the race to the normal path, no harm: both draw the same picture. */
  let earlyFaceURL=null;      /* the portrait, once fetched, so a re-render never blanks it */
  function paintEarlyFace(){
    if(!earlyFaceURL) return;

    const im=new Image(); im.decoding='async'; im.alt='';
    im.style.cssText='width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit';
    im.src=earlyFaceURL;                       /* already in cache: paints in the same frame */

  }

  async function faceFirst(){

  }

  async function loadData(){
    try{ if(window.LFPerson) PERSONA=await LFPerson.get(PERSON_ID,{lang:state.lang}); }catch(e){}
    faceFirst();                                     /* deliberately not awaited */
    try{ const {data:p}=await sb.from('people').select('id,sex,primary_asset,portrait_path,birth_date,birth_certainty,death_date,death_certainty,is_living,metadata').eq('id',PERSON_ID).maybeSingle(); person=p||{id:PERSON_ID}; }catch(e){ person={id:PERSON_ID}; }
    NV=[];   /* name_variants is retired - every name lives in person_facts */
    /* A DECLINED proposal is finished, not pending. This fetched every status, so the
       old text row "Sofia's mother" - declined days ago - still showed on Lea's page as

       as a decision everywhere. */

      .select('id,group_id,field,lang,value,ord,status,created_by,reviewed_by,created_at,published_at')

    /* LFLabel.of() reads a cache that LFLabel.load() fills, and load() was never called
       on this page - so every kin card showed an em dash instead of a person and every
       contributor's name came back empty. Leon saw a column of SPOUSE / CHILD / CHILD
       with no one in it, which is why it read like a log rather than a family. */
    /* lf-label.js was not even on this page, so window.LFLabel was undefined and the
       guard '(window.LFLabel && ...)||""' turned that into an empty string in silence.

    if(!window.LFLabel) console.error('lf-label.js missing - kin and contributor names will be blank');

    tagged=[]; contribNames={};
    try{ const {data:subs}=await sb.from('artefact_subjects').select('artefact_id,detail').eq('person_id',PERSON_ID); const ids=(subs||[]).map(s=>s.artefact_id);
      if(ids.length){ let arts=[]; try{ const {data:a}=await sb.from('artefacts').select('id,storage_path,metadata,contributor_id,body').in('id',ids); arts=a||[]; if(window.LFDB&&LFDB.stories) await LFDB.stories(sb,arts,state.lang); }

        const cids=[...new Set(tagged.map(t=>t.contributor_id).filter(Boolean))];
        if(cids.length){ try{ const {data:pp}=await sb.from('people').select('id').in('id',cids); (pp||[]).forEach(x=>contribNames[x.id]=(window.LFLabel&&LFLabel.of(x.id,(localStorage.getItem('lf_lang')||'en')))||''); }catch(e){} }
      } }catch(e){}
    rels=[];
    try{ const filt='from_person.eq.'+PERSON_ID+',to_person.eq.'+PERSON_ID;
      let rp=[]; try{ const {data}=await sb.from('relationships').select('id,from_person,to_person,kind,certainty,note').or(filt); rp=data||[]; }
      catch(e){ const {data}=await sb.from('relationships').select('id,from_person,to_person').or(filt); rp=data||[]; }
      const others=[...new Set(rp.map(r=>r.from_person===PERSON_ID?r.to_person:r.from_person).filter(Boolean))];
      let names={}; if(others.length){ try{ const {data:pp}=await sb.from('people').select('id').in('id',others); (pp||[]).forEach(x=>names[x.id]=(window.LFLabel&&LFLabel.of(x.id,(localStorage.getItem('lf_lang')||'en')))||''); }catch(e){} }
      /* from_person = PARENT, to_person = CHILD (CLAUDE.md §9) */
      rels=rp.map(r=>{ const isFrom=r.from_person===PERSON_ID; const other=isFrom?r.to_person:r.from_person;
        return { id:r.id, other, name:names[other]||'—', kind:r.kind||'parent', certainty:r.certainty||'remembered', note:r.note||'',
                 dir:isFrom?'other_child':'other_parent', relKey:isFrom?'child':'parent' }; });
    }catch(e){ rels=[]; }
    try{ const {data:all}=await sb.from('people').select('id').neq('id',PERSON_ID).limit(600); PEOPLE=all||[]; }catch(e){ PEOPLE=[]; }
    /* canonical place suggestions: distinct published place values across the whole family + any places table */
    PLACEVALS=[];
    try{ const {data:pv}=await sb.from('person_facts').select('value').in('field',['pbirth','born','lived','home','country']).eq('status','published').limit(3000); (pv||[]).forEach(r=>{ if(r&&r.value) PLACEVALS.push(r.value); }); }catch(e){}

    /* The STORY facet showed a date and a place in quotation marks and called it a story,
       because the artefacts query never asked for `body` - the words themselves were
       never fetched. The story is the story; when and where sit beneath it as a caption,
       unquoted, because they are not something anybody said. */
    memories=tagged.map(t=>({ id:t.artefact_id, cap:(t.body||'').trim(),
      whenwhere:[t.meta&&t.meta.when,t.meta&&t.meta.where].filter(Boolean).join(' · '),

  /* ---------- derive working copy ---------- */
  function groupCustom(pub){ const groups={}; facts.filter(x=>(x.field==='custom_label'||x.field==='custom_value')&&(pub?x.status==='published':x.status!=='published')).forEach(x=>{ (groups[x.group_id]=groups[x.group_id]||{label:{},value:{}}); groups[x.group_id][x.field==='custom_label'?'label':'value'][x.lang]=x.value; });
    return Object.keys(groups).map(gid=>({group_id:gid,...groups[gid]})); }
  function buildNames(){
    const NF=['given','called','family','maiden','patronymic','honorific'];
    NAME=_emptyN(); PEND=_emptyN(); NAMEROW=_emptyN();
    NF.forEach(f=>{ NAME[f]={}; PEND[f]={}; NAMEROW[f]={}; LANGS.forEach(l=>{ const r=pubRow(f,l); NAMEROW[f][l]=r; NAME[f][l]=r?r.value:''; const p=pendList(f,l)[0]; PEND[f][l]=p?p.value:''; }); });
    LANGS.forEach(l=>{ const vp=NV.find(v=>v.lang===l&&v.status==='published'); if(vp){ if(!NAME.given[l]&&vp.given) NAME.given[l]=vp.given; if(!NAME.family[l]&&vp.family) NAME.family[l]=vp.family; }
      const vpe=NV.find(v=>v.lang===l&&v.status!=='published'); if(vpe){ if(!PEND.given[l]&&vpe.given) PEND.given[l]=vpe.given; if(!PEND.family[l]&&vpe.family) PEND.family[l]=vpe.family; } });
    if(!NAME.called.en && person.called_name) NAME.called.en=person.called_name;
    NICKS={en:[],ru:[],he:[]}; PENDNICKS={en:[],ru:[],he:[]};
    LANGS.forEach(l=>{ NICKS[l]=facts.filter(x=>x.field==='nickname'&&x.lang===l&&x.status==='published').sort((a,b)=>(a.ord||0)-(b.ord||0)).map(x=>({id:x.id,value:x.value}));
      PENDNICKS[l]=facts.filter(x=>x.field==='nickname'&&x.lang===l&&x.status!=='published').map(x=>({id:x.id,value:x.value})); });
  }
  /* WHAT IS TRUE ON SCREEN RIGHT NOW, waiting rows included.
     S.life holds the PUBLISHED value, so a second press of Send compared the box against the
     old approved value, found a difference, and sent the very same suggestion again - Leon
     pressed Send twice and it went twice. A change is a change from the newest thing there
     is, whether the keeper has seen it yet or not. */
  function newestVal(field,lang){
    const rows=facts.filter(x=>x.field===field&&(lang==null||x.lang===lang)&&hasv(x.value));
    if(!rows.length) return '';
    const ts=r=>String(r.published_at||r.created_at||'');
    const pen=rows.filter(x=>x.status!=='published').sort((a,b)=>ts(b).localeCompare(ts(a)));
    if(pen.length) return pen[0].value;
    return rows.sort((a,b)=>ts(b).localeCompare(ts(a)))[0].value; }
  /* the violet line that says a field is waiting, shown only where something IS waiting */
  function waitMark(field,lang){ const L=d();
    const pen=facts.filter(x=>x.field===field&&(lang==null||x.lang===lang)&&x.status!=='published'&&hasv(x.value));
    if(!pen.length) return '';
    const pub=(function(){ const r=pubRow(field,lang); return r?r.value:''; })();
    if(pen[pen.length-1].value===pub) return '';
    return `<div class="pending" style="margin-top:6px"><span class="sp"></span>${esc(L.hWaiting)}</div>`; }
  function seed(){
    buildNames();
    /* MINE-FIRST. The box was seeded from the PUBLISHED value, so the moment a suggestion was
       sent the page re-rendered and the field snapped back to the old approved text while the
       new one waited unseen. Leon corrected 'Engineer m' to 'Engineer', sent it, watched the
       box revert to 'Engineer m', pressed Send again and sent 'Engineer m' as a fresh change -
       two requests fourteen seconds apart, and neither of them wrong by its own logic.
       A person sees their OWN waiting suggestion in the box, which is what the violet line
       beneath it is promising. Someone else's unapproved text is NOT shown: that would put
       unreviewed words in front of the family, which is the whole reason the queue exists. */
    const mineFirst=(f,l)=>{ const ts=r=>String(r.published_at||r.created_at||'');
      const mine=facts.filter(x=>x.field===f&&(l==null||x.lang===l)&&x.status!=='published'
                 &&hasv(x.value)&&user&&x.created_by===user.id).sort((a,b)=>ts(b).localeCompare(ts(a)));
      if(mine.length) return mine[0].value;
      return (l==null?pubNewest(f,'und'):pubNewest(f,l))||''; };
    const perLang=f=>{ const o={}; LANGS.forEach(l=>o[l]=mineFirst(f,l)); return o; };
    S={
      life:{ bio:perLang('bio'), occupation:perLang('occupation'), birth:person.birth_date||'', death:person.death_date||'',
        birth_prec:person.birth_certainty||'', /* alive unless somebody has said otherwise: most people in a family album are,
           and an app should not quietly assume the sadder answer */
        living:(person.is_living===null||person.is_living===undefined)?true:!!person.is_living, /* THE FACT IS THE TRUTH, NOT THE COLUMN. This read people.sex, and every one of those is
       null - the approval writes it but the write never lands, so the gender a keeper approved
       vanished the moment the page reloaded. gender lives as a published fact in person_facts,
       language-neutral ('und'), exactly as Leon asked: one value for all languages. */
      gender:(mineFirst('gender','und')||pubNewest('gender','en')||person.sex||''), langspoken:pubList('langspoken','und') },
      places:{ pbirth:pubNewest('pbirth','und')||pubNewest('pbirth','en')||'', lived:pubList('lived','und'), country:perLang('country') },
      kin:pubList('kin','und'),
      more:{ custom:groupCustom(true), sources:pubList('source','und') }
    };
  }

  /* ---------- kindle + pending + game gates ---------- */
  const hasv=v=>v&&String(v).trim()!=='';
  function facetK(fid){
    let k=0.12;
    if(fid==='name') k=(hasv(NAME.given[state.lang])||hasv(NAME.given.en)||hasv(nameLabel()))?1:0.4;
    else if(fid==='face') k=tagged.length?Math.min(1,0.3+tagged.length*0.18):0.15;
    else if(fid==='life'){ const p=[S.life.bio[state.lang]||S.life.bio.en,S.life.occupation[state.lang]||S.life.occupation.en,S.life.birth,S.life.gender]; k=Math.max(0.12,p.filter(hasv).length/p.length); }
    else if(fid==='places'){ const c=(hasv(S.places.pbirth)?1:0)+(S.places.lived.length?1:0)+(hasv(S.places.country[state.lang]||S.places.country.en)?1:0); k=Math.max(0.12,c/3); }
    else if(fid==='story') k=memories.length?Math.min(1,0.3+memories.length*0.2):0.12;
    else if(fid==='kin'){ const c=rels.length+S.kin.length; k=c?Math.min(1,0.3+c*0.18):0.12; }
    else if(fid==='reel') k=overallFill();
    else if(fid==='more') k=(S.more.custom.length+S.more.sources.length)?0.5:0.12;
    return Math.max(0.12,Math.min(1,k));
  }
  function overallFill(){ const ids=['name','face','life','places','story','kin','more']; const s=ids.reduce((a,id)=>a+facetK(id),0); return s/ids.length; }
  function catPending(fid){ const fs=FACETFIELDS[fid]||[];
    if(fid==='name' && NV.some(v=>v.status!=='published')) return true;
    return facts.some(x=>fs.includes(x.field)&&x.status!=='published');
  }
  function gameLocked(gid){
    if(gid==='whoiswho'||gid==='crowd') return tagged.length<1;
    if(gid==='order') return !(hasv(S.life.birth)||hasv(S.life.death));
    if(gid==='wherewas'||gid==='thread') return !(hasv(S.places.pbirth)||S.places.lived.length);
    if(gid==='whosememory'||gid==='voice') return memories.filter(m=>!m.pending).length<1;
    /* it asks what came next, so it needs at least two moments to have a 'next' at all */
    if(gid==='whatnext') return memories.filter(m=>!m.pending).length<2;
    return false;
  }

  /* Languages are offered, not typed from memory: a free box gives 'Rus', 'russian' and

     spacing-insensitively. A language genuinely absent is still allowed - a family may speak
     something no list of mine contains - but a duplicate of one on the list is not. */
  const LANGLIST=['English','Russian','Hebrew','Ukrainian','Yiddish','Polish','German','French',
    'Spanish','Italian','Arabic','Romanian','Hungarian','Czech','Belarusian','Moldovan',
    'Lithuanian','Latvian','Georgian','Armenian','Azerbaijani','Uzbek','Kazakh','Turkish',
    'Greek','Dutch','Portuguese','Swedish','Norwegian','Danish','Finnish','Bulgarian',
    'Serbian','Croatian','Slovak','Persian','Amharic','Ladino','Aramaic'];
  function chipAddBox(field,label){ const L=d();

    return dl+`<div class="chipadd" data-for="${field}" style="display:none;margin-top:8px"><input class="inp"${isLang?' list="lfLangs" autocomplete="off"':''} placeholder="${esc(label||'')}"><div class="btnrow" style="margin-top:8px"><button class="btn ghost" data-cadd-cancel>${L.cancel}</button><button class="btn violet" data-cadd-ok="${field}">${L.send}</button></div></div>`; }
  function chipsField(field,addLabel,cool){ const L=d(); const pubs=pubList(field,'und'); const pends=pendList(field,'und');

  /* 'About' is where a life gets told, and it was a single-line box the width of a name -

  /* ---------- name facet ---------- */
  function namePendRef(k,l){ const f=facts.find(x=>x.field===k&&x.lang===l&&x.status!=='published'); if(f) return {kind:'fact',id:f.id,value:f.value};

  /* every published name part gets edit + delete (or "ask to remove") */
  function partCtls(k){ const L=d(); const lang=state.lang; const row=(NAMEROW[k]||{})[lang];
    let del=delCtl(row);
    if(!del&&(k==='given'||k==='family')){ const v=NV.find(x=>x.lang===lang&&x.status==='published'&&x[k]);

    return `<div class="rowctl"><button class="np-ctl" data-editpart="${k}">${sv(I.pen,1.7)} ${esc(L.edit)}</button>${del}</div>`; }
  function namePartBlock(k,v){ const L=d(); return `<div class="namepart"><div class="np-lab">${esc(L[k]||k)}</div><div class="np-val serif">${esc(v)}</div>${partCtls(k)}</div>`; }
  /* The page's own label, in one place. NAME.display no longer exists - the field is gone -

  function nameLabel(lang){

    const pick=k=>(NAME[k]&&(NAME[k][lang]||NAME[k].en||NAME[k].ru||NAME[k].he))||'';
    const fam=pick('family'), cal=pick('called'), giv=pick('given');

  function nameBody(){ const L=d(); const lang=state.lang;

        ${(PENDNICKS[lang]||[]).length?(state.keeper?(PENDNICKS[lang]||[]).map(n=>`<div class="pendrow"><span style="font-size:12px;color:var(--edit-hi)">${esc(n.value)}</span>${keeperInline(n.id,'fact')}</div>`).join(''):`<div class="pending" style="margin-top:6px"><span class="sp"></span>${L.bothpending}</div>`):''}</div>`; }
    /* nickname is always addable (a person may have several) */

        ${LANGS.map(l=>`<div class="mlvar ${l==='he'?'rtl':''}"><span class="tag">${l}</span><input class="inp" data-field="${k}" data-lang="${l}" value="${esc((NAME[k]&&NAME[k][l])||'')}" placeholder="${L.addfield}"></div>`).join('')}

  /* ONE SEND FOR THE WHOLE PAGE (Leon, 2026-08-22). The name editor drew its own Cancel and

    out+=`<div class="np-addmenu" hidden>${unset.map(k=>`<button class="add-opt" data-addpart="${k}"><span class="ic">${sv(I.plus,1.8)}</span><span><span class="nm">${esc(L[k]||k)}</span><span class="ds">${L.addpartHint}</span></span></button>`).join('')}</div>`;

  /* ---------- per-facet bodies ---------- */
  /* place typeahead: reuse a canonical value instead of re-typing a variant.
     Normalise (lowercase, strip spacing/punctuation) so "Tel Aviv"/"Tel-Aviv"/"tel aviv"
     collapse to ONE suggestion — but never rewrite what the user chose/typed. Free text is
     always allowed (a <datalist> suggests but does not constrain), so historical places that
     no longer exist — USSR, Yugoslavia, the Ottoman Empire — are first-class. */
  const normPlace=s=>String(s==null?'':s).toLowerCase().replace(/[\s\-'’.,·]+/g,'');
  function placeSuggestions(){ const vals=[];
    (PLACEVALS||[]).forEach(v=>{ if(hasv(v)) vals.push(v); });
    facts.filter(x=>['pbirth','born','lived','home','country'].includes(x.field)&&hasv(x.value)).forEach(x=>vals.push(x.value));
    const seen={}, out=[];
    vals.forEach(v=>{ const k=normPlace(v); if(k&&!seen[k]){ seen[k]=1; out.push(String(v)); } });
    out.sort((a,b)=>a.localeCompare(b)); return out; }
  /* Android's datalist is unreliable inside sheets and only prefix-matches, so a
     visible typeahead rides on top of it; substring match, tap to fill. */
  (function(){
    let tbox=null;
    function tclose(){ if(tbox){ tbox.remove(); tbox=null; } }
    document.addEventListener('input',e=>{
      const inp=e.target;
      if(!(inp instanceof HTMLInputElement)||inp.getAttribute('list')!=='placelist') return;
      const q=normPlace(inp.value); tclose(); if(!q) return;
      const hits=placeSuggestions().filter(s=>normPlace(s).includes(q)&&normPlace(s)!==q).slice(0,6);
      if(!hits.length) return;
      tbox=document.createElement('div');
      tbox.style.cssText='position:fixed;z-index:120;background:#0d1628;border:1px solid #223050;border-radius:12px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.5);';
      hits.forEach(h=>{ const r=document.createElement('div'); r.textContent=h;
        r.style.cssText='padding:10px 13px;font-size:14.5px;color:#e9eef8;cursor:pointer;border-bottom:1px solid #16203a;';
        r.addEventListener('pointerdown',ev=>{ ev.preventDefault(); inp.value=h; tclose(); });
        tbox.appendChild(r); });
      const rc=inp.getBoundingClientRect();
      tbox.style.left=rc.left+'px'; tbox.style.top=(rc.bottom+4)+'px'; tbox.style.width=rc.width+'px';
      document.body.appendChild(tbox);
    });
    document.addEventListener('pointerdown',e=>{ if(tbox&&!tbox.contains(e.target)) tclose(); },true);
    document.addEventListener('scroll',tclose,true);
  })();
  function placeDatalist(){ return `<datalist id="placelist">${placeSuggestions().map(s=>`<option value="${esc(s)}"></option>`).join('')}</datalist>`; }
  function placesAppLine(n){ const t={ en:`Tied to ${n} place${n===1?'':'s'}; the route between them is drawn by the app.`, ru:`Связана с ${n} мест${n===1?'ом':'ами'}; маршрут строит приложение.`, he:`קשורה ל-${n} מקומות; המסלול משורטט על ידי האפליקציה.` }; return t[state.lang]||t.en; }
  function wireCountryTie(root){
    const ph=root.querySelector('[data-newhome]'), pc=root.querySelector('[data-newcountry]');
    if(!ph||!pc||ph._tied) return; ph._tied=1;
    let manual=false;
    pc.addEventListener('input',()=>{ manual=!!pc.value.trim(); });
    async function tie(){ const val=ph.value.trim(); if(!val||manual||pc.value.trim()) return;
      const c=await window.LFPlace.country(val, state.lang, sb); if(c&&!pc.value.trim()&&!manual){ pc.value=c; pc.dispatchEvent(new Event('input',{bubbles:true})); } }
    ph.addEventListener('change',tie); ph.addEventListener('blur',tie);
  }
  /* ---------- HOMES — one group_id per home (Leon, 2026-08-14) ----------
     A person lives in many places, and "Tel Aviv, Israel, 1998-2004" is ONE fact with four
     parts, not four facts with nothing holding them together. Before this, `lived` and
     `country` were written as separate rows with separate group_ids and no years at all, so
     the sentence could not be expressed - Leon's own two rows in the queue were exactly that.
     A home is now four rows sharing a group_id: lived, country, home_from, home_to, every
     one optional. The field name `lived` is KEPT because eight other files read it.
     An EDIT re-uses the group_id: the new rows land in_review alongside the published ones,
     which is why the card can show the waiting version in violet next to what is approved. */
  const HOMEF=['lived','country','home_from','home_to'];
  function homeGroups(){ const g={};
    facts.filter(x=>HOMEF.indexOf(x.field)>=0&&x.group_id).forEach(x=>{
      const b=g[x.group_id]=g[x.group_id]||{group_id:x.group_id,rows:[],pub:{},pen:{}};
      b.rows.push(x);
      const bucket=(x.status==='published')?b.pub:b.pen;
      const ts=String(x.published_at||x.created_at||'');
      const key=(x.field==='country')?('country:'+(x.lang||'und')):x.field;
      const prev=bucket[key];
      if(!prev||ts>prev.ts) bucket[key]={value:x.value,id:x.id,ts:ts,status:x.status}; });
    return Object.keys(g).map(k=>g[k])
      .filter(b=>HOMEF.some(f=>hasv((pick(b.pub,f)||{}).value)||hasv((pick(b.pen,f)||{}).value)))
      .sort((a,b)=>{ const ay=hv(a,'home_from')||'9999', by=hv(b,'home_from')||'9999';
        return String(ay).localeCompare(String(by)); }); }
  function pick(bucket,f){ if(f!=='country') return bucket[f];
    const order=[state.lang,'en','und'].concat(LANGS);
    for(const l of order){ const r=bucket['country:'+l]; if(r&&hasv(r.value)) return r; }
    const k=Object.keys(bucket).find(k=>k.indexOf('country:')===0&&hasv(bucket[k].value));
    return k?bucket[k]:null; }
  function hv(b,f){ const p=pick(b.pen,f); if(p&&hasv(p.value)) return p.value; const q=pick(b.pub,f); return (q&&hasv(q.value))?q.value:''; }
  function hpub(b,f){ const q=pick(b.pub,f); return (q&&hasv(q.value))?q.value:''; }
  function hPending(b){ return HOMEF.some(f=>{ const p=pick(b.pen,f); return p&&hv(b,f)!==hpub(b,f); }); }
  function homeYears(b){ const L=d(); const f=hv(b,'home_from'), t=hv(b,'home_to');
    if(!hasv(f)&&!hasv(t)) return '';
    if(hasv(f)&&!hasv(t)) return f+' — '+L.hPresent;
    if(!hasv(f)&&hasv(t)) return '… — '+t;
    return f+' — '+t; }
  /* a home reads in the reader's language; the stored text is the key and never moves */
  let PLMAP={};
  const pn=v=>(window.LFDB&&LFDB.placeName)?LFDB.placeName(v,PLMAP):v;
  function homeWhere(b){ return [pn(hv(b,'lived')),hv(b,'country')].filter(hasv).join(', '); }
  /* who may take a home away: the keeper always; the person who suggested it while it waits;
     anyone else asks, per Rule 3. */
  function homeDelCtl(b){ const L=d(); const req=removalReq(b.group_id);
    if(req) return `<span class="remreq">${esc(state.keeper?L.askremove:L.removeAsked)}</span>`;
    const mine=b.rows.every(r=>canDelete(r));
    return `<button class="np-ctl ${mine?'':'warn'}" data-delhome="${b.group_id}">${sv(mine?I.trash:I.x,1.7)} ${esc(mine?L.remove:L.askremove)}</button>`; }
  function homeCard(b){ const L=d(); const pend=hPending(b);
    const where=homeWhere(b)||'—', yrs=homeYears(b);
    const style=pend?' style="border-color:rgba(201,162,255,.34);background:rgba(201,162,255,.06)"':'';
    return `<div class="detailrow"${style} data-home="${b.group_id}">
      <div><div class="dv">${esc(where)}</div>
        ${yrs?`<div class="dl" style="text-transform:none;letter-spacing:0;margin-top:3px">${esc(yrs)}</div>`:''}
        ${pend?`<div class="pending" style="margin-top:6px"><span class="sp"></span>${esc(L.hWaiting)}</div>`:''}
        <div class="rowctl"><button class="np-ctl" data-edithome="${b.group_id}">${sv(I.pen,1.7)} ${esc(L.hEdit)}</button>${homeDelCtl(b)}</div>
      </div></div>`; }
  function homeForm(){ const L=d(); const rtl=state.lang==='he'?' style="direction:rtl;text-align:right"':'';
    return `<div class="homeadd" data-homeadd style="display:none;margin-top:10px;padding-inline-start:12px;border-inline-start:2px solid rgba(127,180,216,.25)">
      <input type="hidden" data-homegid value="">
      <div class="field"><label>${esc(L.addplace)}</label><input class="inp" list="placelist" data-newhome placeholder="${esc(L.lived)}"${rtl}></div>
      <div class="field"><label>${esc(L.country)}</label><input class="inp" list="placelist" data-newcountry placeholder="${esc(L.addcountry)}"${rtl}></div>
      <div class="row2">
        <div class="field"><label>${esc(L.hFrom)}</label><input class="inp" inputmode="numeric" maxlength="4" data-newfrom placeholder="1998"></div>
        <div class="field"><label>${esc(L.hTo)}</label><input class="inp" inputmode="numeric" maxlength="4" data-newto placeholder="${esc(L.hPresent)}"></div></div>
      <div class="pending" data-homeerr style="display:none;margin-top:6px"></div>
      <div class="btnrow"><button class="btn ghost" data-act="homecancel">${L.cancel}</button><button class="btn violet" data-act="homesend">${L.send}</button></div></div>`; }
  /* open the form, blank for a new home or filled from an existing one. Editing keeps the
     group_id, so the suggestion joins the home it belongs to instead of starting a new one. */
  function openHome(gid){ const card=$('.facet[data-facet="places"]'); if(!card) return;
    const box=card.querySelector('[data-homeadd]'); if(!box) return;
    const g=gid?homeGroups().find(b=>b.group_id===gid):null;
    const set=(sel,v)=>{ const el=box.querySelector(sel); if(el) el.value=v||''; };
    set('[data-homegid]',gid||''); set('[data-newhome]',g?hv(g,'lived'):'');
    set('[data-newcountry]',g?hv(g,'country'):''); set('[data-newfrom]',g?hv(g,'home_from'):'');
    set('[data-newto]',g?hv(g,'home_to'):'');
    const err=box.querySelector('[data-homeerr]'); if(err){ err.style.display='none'; err.textContent=''; }
    box.style.display='block'; wireCountryTie(box);
    const i=box.querySelector('[data-newhome]'); if(i) i.focus(); }
  /* a year is four digits and inside living memory of a calendar; an empty one is allowed,
     because a family often knows the place and not the year. */
  function yearOk(v){ if(!hasv(v)) return true; if(!/^\d{4}$/.test(v)) return false;
    const n=+v; return n>=1700 && n<=(new Date().getFullYear()+1); }
  /* THE CHEAP 80% OF AUTOMATIC TRANSLATION (Leon, 2026-08-14).
     A country typed in English used to show an English reader "USSR" and a Russian reader
     the same "USSR", because there was only ever one row. Now the app translates it into
     the other two languages the first time it is entered, and marks those rows as its own
     work with ord=1 - a person's own typing is always ord=0.
     The lock, which is the whole point: a language a HUMAN has typed is never translated
     over again, ever. Once someone corrects the Russian, the Russian is theirs.
     No diffing, no splicing, no staleness tracking - those are the expensive parts and they
     stay parked (see CLAUDE.md 4 PARKED).
     A failure is spoken aloud. This function failed silently for an unknown length of time
     because its one caller swallowed the error and returned null. */
  /* A MODEL'S ANSWER IS NOT A FACT UNTIL IT LOOKS LIKE ONE.
     Asked for USSR in Hebrew, the function returned the abbreviation, then a transliteration
     in brackets, then an English gloss, then "Or more commonly used:", then the full name -
     five lines of conversation, which went into the archive verbatim as a country. The same
     call by hand had returned two clean words minutes earlier, so this is not reliable and
     cannot be trusted unchecked.
     A country name is one short line in the target language's own script. Take the first
     line, drop any bracketed aside and any trailing punctuation, and refuse it outright if
     it is too long or written in the wrong alphabet - refusing is safe, because the reader
     falls back to a language that does have a name. Never mix alphabets. */
  function cleanTr(v,lang){ if(!v) return '';
    /* ONE LANGUAGE, ONE ALPHABET (Leon, 2026-08-21). Arabic reached a Hebrew story because
       only Latin, Cyrillic and Hebrew were ever counted and a third script was invisible.
       A single character from another alphabet means the translation went wrong, not that
       it needs trimming - it is refused whole, here as on the story pages. */
    if(/[\u0600-\u06FF\u0750-\u077F\u0370-\u03FF\u0530-\u058F\u4E00-\u9FFF\u3040-\u30FF\u0E00-\u0E7F\u0900-\u097F]/.test(String(v))) return '';
    if(lang==='he' && /[\u0400-\u04FF]/.test(String(v))) return '';
    if(lang==='ru' && /[\u0590-\u05FF]/.test(String(v))) return '';
    if(lang==='en' && /[\u0400-\u04FF\u0590-\u05FF]/.test(String(v))) return '';

    let t=String(v).split(/[\r\n]+/).map(x=>x.trim()).filter(Boolean)[0]||'';
    t=t.replace(/\s*[\(\[].*$/,'').replace(/^["'\u201c\u201e]+|["'\u201d\u201c]+$/g,'').replace(/[\s.,;:!]+$/,'').trim();

    if(lang==='he' && !/[\u0590-\u05FF]/.test(t)) return '';
    if(lang==='ru' && !/[\u0400-\u04FF]/.test(t)) return '';
    if(lang==='he' && /[A-Za-z]/.test(t)) return '';
    if(lang==='ru' && /[A-Za-z]/.test(t)) return '';
    return t; }
  /* cleanTr is for ONE SHORT LINE (a country, an occupation). It cannot be used on a bio:
     asked to translate "USSR" the function once returned five lines - an abbreviation, a
     bracketed transliteration, an English gloss, "Or more commonly used:", then the name -
     and a first-line-only rule survives that only because a country IS one line. A paragraph
     is not, and taking its first line would throw away most of it.
     cleanBio judges PROSE. The failure it must catch is the same one - the model wrapping an
     answer in commentary about the answer - but the safe move for a paragraph is to drop the
     lines that are commentary and keep the lines that are the translation, then sanity-check
     the whole. A line is commentary if it is written in the WRONG alphabet for the target
     (an English gloss inside a Hebrew reply, "Or more commonly used:"); such a line has more
     foreign-script letters than target-script letters and is dropped. Numbers/dates/punctuation
     lines carry no alphabet and are kept. After the cut: it must actually contain the target
     script, must not be an outright AI refusal, and must not be WILDLY longer than the source
     (padding is explanation, not translation). If nothing survives, refuse - the reader falls
     back to a language that has a value, exactly as with a country. */
  function cleanBio(v,lang,src){ if(v==null) return '';
    /* ONE LANGUAGE, ONE ALPHABET (Leon, 2026-08-21). Arabic reached a Hebrew story because
       only Latin, Cyrillic and Hebrew were ever counted and a third script was invisible.
       A single character from another alphabet means the translation went wrong, not that
       it needs trimming - it is refused whole, here as on the story pages. */
    if(/[\u0600-\u06FF\u0750-\u077F\u0370-\u03FF\u0530-\u058F\u4E00-\u9FFF\u3040-\u30FF\u0E00-\u0E7F\u0900-\u097F]/.test(String(v))) return '';
    if(lang==='he' && /[\u0400-\u04FF]/.test(String(v))) return '';
    if(lang==='ru' && /[\u0590-\u05FF]/.test(String(v))) return '';
    if(lang==='en' && /[\u0400-\u04FF\u0590-\u05FF]/.test(String(v))) return '';

    let raw=String(v).replace(/[\u00a0\ufeff]/g,' ').trim(); if(!raw) return '';
    if(/\b(as an ai|i (can('?t| ?not)|could not|am unable)|i'?m unable to|cannot translate)\b/i.test(raw)) return '';
    const cnt=s=>({ lat:(s.match(/[A-Za-z]/g)||[]).length, cyr:(s.match(/[\u0400-\u04FF]/g)||[]).length, heb:(s.match(/[\u0590-\u05FF]/g)||[]).length });
    const on=c=> lang==='ru'?c.cyr : lang==='he'?c.heb : c.lat;
    const off=c=> lang==='ru'?(c.lat+c.heb) : lang==='he'?(c.lat+c.cyr) : (c.cyr+c.heb);
    const kept=raw.split(/\r?\n/).map(s=>s.trim()).filter(line=>{ if(!line) return false;
      const c=cnt(line); const o=on(c), f=off(c);
      if(o===0&&f===0) return true;                 /* a date / a number / punctuation only */
      return o>0 && o>=f; });                        /* a line mostly in the target's own script */
    let t=kept.join('\n').replace(/\n{3,}/g,'\n\n').trim();
    if(!t) return '';
    const C=cnt(t);
    if((lang==='ru'||lang==='he') && on(C)===0) return '';   /* nothing in the target script */
    if(lang!=='ru'&&lang!=='he' && C.lat===0) return '';
    if(t.length > (String(src||'').length*3 + 80)) return '';/* padded with explanation */
    return t; }
  /* AUTOMATIC TRANSLATION - one implementation for every field that gains it (Leon, 2026-08-20).
     On first entry the app carries a value into the other two languages and stores all three.
     THE LOCK is the whole point: a language a HUMAN has typed is NEVER machine-written again -
     an ord=0 row in that language is human, and we skip it. The app's own rows are ord=1.
     Every write lands in_review (insFact enforces this; a 'published' insert is silently
     rejected by RLS). A failure SPEAKS through trFail, never returns a silent null.
       ref      - group_id for grouped fields; the person id for ungrouped bio

  /* ONE LANGUAGE IS THE SOURCE; THE REST FOLLOW IT (Leon, 2026-08-20).
     Leon wrote a bio in English, then corrected the Hebrew - and the app rewrote the RUSSIAN
     from his Hebrew, three seconds later, because Russian was still a machine row and every
     edit regenerated every machine row. That is wrong twice over: he never asked for Russian
     to change, and a translation of a translation drifts further from what he actually wrote.
     A field now has a SOURCE language: the one a person wrote first, found as the oldest
     human row. Only a change to the source re-translates. Editing any other language makes
     that language yours - it stops being machine-written for good - and touches nothing else.
     With no rows yet, whatever is typed first becomes the source. */
  function sourceLang(field,ref){
    const ts=r=>String(r.published_at||r.created_at||'');

  /* THE PERSON'S GENDER BELONGS TO EVERYTHING WRITTEN ABOUT THEM (Leon, 2026-08-22).

     not - and those are the sentences that inflect: 'Она работала' against 'Он работал',
     'היא עבדה' against 'הוא עבד'. So a woman's life was described in the masculine
     whenever the model guessed wrong, and nothing on screen showed it. Every translation
     on this page now carries whose life it is. */
  function subjectSex(){ const g=S.life.gender||((person&&person.sex==='male')?'m':(person&&person.sex==='female')?'f':'');
    return (g==='m'||g==='f')?g:null; }

    const src=sourceLang(field, grouped?ref:null);

    const others=LANGS.filter(l=>l!==from&&!(opt.skip&&opt.skip.has(l)));

        ? facts.some(x=>x.group_id===ref&&x.field===field&&x.lang===l&&(x.ord||0)===0&&hasv(x.value))
        : facts.some(x=>x.field===field&&x.lang===l&&(x.ord||0)===0&&hasv(x.value));

      let out='';

      if(opt.gender) item.gender=opt.gender;

  /* OCCUPATION IS NOT ONE THING (Leon, 2026-08-15).

    /* more */
    let h=S.more.custom.map(c=>`<div class="detailrow"><div><div class="dl">${esc(c.label[lang]||c.label.en||c.label.ru||c.label.he||'')}</div><div class="dv">${esc(c.value[lang]||c.value.en||c.value.ru||c.value.he||'')}</div>
        <div class="rowctl"><button class="np-ctl" data-editgroup="${c.group_id}">${sv(I.pen,1.7)} ${L.edit}</button>
          <button class="np-ctl warn" data-delgroup="${c.group_id}">${sv(I.trash,1.7)} ${esc(L.askremove)}</button></div></div></div>`).join('');
    h+=pendingCustomRows();

    h+=`<div class="field" style="margin-top:14px"><label>${L.source}</label>${chipsField('source',L.source,true)}</div>`;

  async function fillFaces(){ if(!person) return; const fh=$('#faceHost'); if(fh){ const ff=pubList('face','und').slice().sort((a,b)=>String(b.published_at||b.created_at||'').localeCompare(String(a.published_at||a.created_at||'')))[0]; const fv=ff?(function(){try{return JSON.parse(ff.value);}catch(e){return null;}})():null;
    const mbox=(person.metadata&&person.metadata.face_box)||null;
    /* THE BAKED PORTRAIT COMES FIRST, and on its own. Every branch below needs a source
       photograph, so someone with a portrait but no primary_asset - which is everyone whose
       face came from tagging, 36 of the 47 - fell through to a live crop of a tagged photo
       and showed an older face than the tree did. The tree drew the portrait; this page
       never asked for it. */
    if(person.portrait_path && window.LFFace){
      LFFace.into(fh,{portrait:person.portrait_path,path:person.primary_asset||(fv&&fv.storage_path)||(tagged[0]&&tagged[0].storage_path)||'',
        box:mbox||(fv||null)||(tagged[0]&&tagged[0].box)||null,size:200,priority:true});
    }
    else if(person.primary_asset&&mbox){ faceInto(fh,person.primary_asset,mbox); }
    else if(fv&&fv.storage_path){ faceInto(fh,fv.storage_path,fv); }
    else if(person.primary_asset){ faceInto(fh,person.primary_asset,null); }
    else if(tagged[0]){ faceInto(fh,tagged[0].storage_path,tagged[0].box); } }
    $$('.tagshot .im[data-thumb]').forEach(async el=>{ const i=+el.getAttribute('data-thumb'); const t=tagged[i]; if(!t) return; const u=await signedUrl(t.storage_path,640); if(u) el.innerHTML=`<img src="${u}" alt="" loading="lazy" decoding="async">`; }); }
  /* the beads ARE the navigation: one facet on screen at a time */

    state.facet=fid;
    $$('.cat[data-jump]').forEach(b=>{ const on=b.dataset.jump===fid; b.classList.toggle('sel',on); b.setAttribute('aria-pressed',on?'true':'false'); });
    $$('.facet[data-facet]').forEach(c=>{ const on=c.dataset.facet===fid; c.hidden=!on; c.classList.remove('enter'); if(on&&!reduceMotion){ void c.offsetWidth; c.classList.add('enter'); } });
    const screen=$('.screen'), card=$(`.facet[data-facet="${fid}"]`);
    if(screen&&card){ const top=card.getBoundingClientRect().top-screen.getBoundingClientRect().top+screen.scrollTop-12;
      screen.scrollTo({ top:Math.max(0,top), behavior:reduceMotion?'auto':'smooth' }); } }

  async function openFace(){ const L=d(); const sh=$('.sheet[data-sheet="face"]');
    /* Ask for a picture the phone can actually hold. This requested the ORIGINAL - 4000x2252
       and 1.4MB for Sofia's - and Leon's Chrome painted only part of it into the stage: a hard
       vertical edge with nothing beyond it, moving with the photograph. Everything else was
       ruled out by measurement first: his device reported the element covering the stage with
       object-fit:cover and complete:true, and a column-by-column scan of exactly the region he
       was seeing found a largest single-column brightness drop of THREE - there is no edge in
       the photograph. 1600px is far more than the stage can show even at full zoom, and it is
       a tenth of the bytes. */
    const gal=await Promise.all(tagged.map(async(t,i)=>({i,url:await signedUrl(t.storage_path,1600),box:t.box})));
    const gals=gal.map(g=>`<div class="g" data-g="${g.i}">${g.url?`<img src="${g.url}" alt="">`:galSVG(g.i)}</div>`).join('');
    sh.innerHTML=`<div class="grip"></div><h3>${L.changeface}</h3><div class="sub">${L.changefaceSub}</div>
      <div class="gal">${gals||`<div class="sub">${L.noFace}</div>`}</div>
      <div class="cropstage" data-crop><div class="cimg"></div><div class="cmask"></div><div class="cring"></div></div>
      <div class="zoomrow">${sv(I.zoomout,1.6)}<input type="range" min="100" max="400" value="145" data-zoom>${sv(I.zoomin,1.6)}</div>
      <div class="btnrow"><button class="btn ghost" data-act="close">${L.cancel}</button><button class="btn violet" data-act="facesave">${L.send}</button></div>`;
    let z=145,px=50,py=44,drag=false,sx,sy,bx,by,chosen=null; const img=sh.querySelector('.cimg'), st=sh.querySelector('[data-crop]');
    /* THE WHOLE PHOTOGRAPH, NOT ITS MIDDLE.
       The stage only ever showed the centred SQUARE of a rectangular photo, so the left and
       right of every landscape picture were unreachable - and at high zoom near the square's
       edge there was nothing to draw, which is the "dark band" that cost us five attempts.
       It was the photograph's boundary all along.
       The image is now fitted whole (contain) and panned freely; the ring can be placed
       anywhere in it. Framing is emitted as {x,y,w,h,exact:1} in fractions of the FULL image,
       which lf-face already renders - legacy zoom/px/py entries keep working through their
       own path, so nothing already in the forest has to move. */
    let iw=0, ih=0, reopen=null;         /* natural size of the chosen photograph */
    let fit=1;                           /* scale that fits the whole photo in the stage */
    const S=()=>st.clientWidth||250;
    const apply=()=>{
      if(!iw||!ih) return;
      const k=z/100, sc=fit*k, w=iw*sc, h=ih*sc;
      /* px,py are the CENTRE of the view, in fractions of the image (0..1) */
      const cx=Math.max(0,Math.min(1,px/100)), cy=Math.max(0,Math.min(1,py/100));
      img.style.cssText='position:absolute;width:'+Math.round(w)+'px;height:'+Math.round(h)+'px;'
        +'left:'+Math.round(S()/2-cx*w)+'px;top:'+Math.round(S()/2-cy*h)+'px;';
    };
    const setImg=g=>{ chosen=g; img.innerHTML=g.url?`<img src="${g.url}" alt="">`:galSVG(g.i);
      const el0=img.querySelector('img');
      const measure=()=>{ if(!el0) return; iw=el0.naturalWidth||1; ih=el0.naturalHeight||1;
        fit=Math.min(S()/iw, S()/ih);
        if(reopen){ const b=reopen; reopen=null;
          const sideSrc=Math.max(b.w*iw,b.h*ih);
          z=Math.max(100,Math.min(400, Math.round(100*(S()/sideSrc)/fit)));
          px=((b.x*iw)+sideSrc/2)/iw*100; py=((b.y*ih)+sideSrc/2)/ih*100;
          const zr=sh.querySelector('[data-zoom]'); if(zr) zr.value=z; }
        apply(); };
      if(el0){ if(el0.complete) measure(); else el0.addEventListener('load',measure,{once:true}); } else { apply(); }
    };
    /* open on the current portrait: same photo, same zoom, same position */
    const curFF=pubList('face','und').slice().sort((a,b)=>String(b.published_at||b.created_at||'').localeCompare(String(a.published_at||a.created_at||'')))[0];
    let cur0=null; if(curFF){ try{ cur0=JSON.parse(curFF.value); }catch(e){} }
    let startG=gal[0], gi0=0;
    if(cur0){ const j=tagged.findIndex(t=>t.artefact_id===cur0.artefact_id||t.storage_path===cur0.storage_path);
      if(j>=0&&gal[j]){ startG=gal[j]; gi0=j;
        if(cur0.zoom!=null){ z=Math.max(100,Math.min(400,+cur0.zoom||145)); }
        if(cur0.px!=null) px=+cur0.px; if(cur0.py!=null) py=+cur0.py;
        /* an exact box describes the whole image and outranks the old stage numbers */
        if(cur0.box&&cur0.box.exact&&cur0.box.w>0){ reopen=cur0.box; } } }
    if(startG){ setImg(startG); const ge=sh.querySelector('[data-g="'+gi0+'"]'); if(ge) ge.classList.add('on'); const zr=sh.querySelector('[data-zoom]'); if(zr) zr.value=z; }
    sh.querySelector('[data-zoom]').oninput=e=>{ z=+e.target.value; apply(); };
    st.addEventListener('pointerdown',e=>{ drag=true; sx=e.clientX; sy=e.clientY; bx=px; by=py; st.setPointerCapture(e.pointerId); });
    st.addEventListener('pointermove',e=>{ if(!drag)return;
      const k=z/100, w=iw*fit*k||1, h=ih*fit*k||1;
      px=bx-(e.clientX-sx)/w*100; py=by-(e.clientY-sy)/h*100; apply(); });
    st.addEventListener('pointerup',()=>drag=false);
    sh.querySelectorAll('[data-g]').forEach(el=>el.onclick=()=>{ sh.querySelectorAll('.g').forEach(x=>x.classList.remove('on')); el.classList.add('on'); setImg(gal[+el.dataset.g]); });
    sh._faceSave=async()=>{ let ok=true; if(chosen){ const t=tagged[chosen.i];
      /* Emit the framing in fractions of the WHOLE photograph - {x,y,w,h,exact:1} - which is
         what lf-face draws from. The old payload described a position inside the centred
         SQUARE, which is why the left and right of a landscape picture could never be chosen.
         zoom/px/py are still written alongside so an older client can still read something. */
      const payload={artefact_id:t.artefact_id,storage_path:t.storage_path,zoom:z,px:px,py:py};
      if(iw&&ih){
        const k=z/100, sc=fit*k;                 /* displayed pixels per source pixel */
        const sideSrc=Math.min(S()/sc, Math.min(iw,ih));   /* the ring, in source pixels */
        const cx=Math.max(0,Math.min(1,px/100))*iw, cy=Math.max(0,Math.min(1,py/100))*ih;
        let sx=cx-sideSrc/2, sy=cy-sideSrc/2;
        sx=Math.max(0,Math.min(iw-sideSrc,sx)); sy=Math.max(0,Math.min(ih-sideSrc,sy));
        const rnd=v=>Math.round(v*10000)/10000;
        payload.box={x:rnd(sx/iw),y:rnd(sy/ih),w:rnd(sideSrc/iw),h:rnd(sideSrc/ih),exact:1};
      }
      if(t&&await insFact('face','und',JSON.stringify(payload))===false) ok=false; } hideSheets(); await reload(); if(ok) toast(L.sent); };
    showSheet('face'); }

    sh.dataset.group=groupId||'';
    sh.innerHTML=`<div class="grip"></div><h3>${groupId?L.edit:L.adddetail}</h3><div class="sub">${L.adddetailsub}</div>
      <div class="field"><label>${L.detailLabel} (${state.lang})</label><input class="inp" data-add-label placeholder="${L.detailLabel}" value="${esc(lab0)}" style="margin-bottom:10px">
      <label>${L.detailValue} (${state.lang})</label><input class="inp" data-add-value placeholder="${L.detailValue}" value="${esc(val0)}"></div>
      <div class="hint" style="display:flex;gap:9px">${sv(I.info,1.7)}<span>${L.keeper}</span></div>
      <div class="btnrow"><button class="btn ghost" data-act="close">${L.cancel}</button><button class="btn violet" data-act="addsend">${L.send}</button></div>`;
    showSheet('add'); }

  // gids that have a real, built, engine-wired play page (scoped by ?id=)
  const GAME_PAGES={ whosememory:'game-who-is-who.html', voice:'game-missing-voice.html', thread:'game-tangled-thread.html', crowd:'crowd-real.html', order:'game-order-of-things.html', wherewas:'game-where-was-this.html', whatnext:'game-what-happened-next.html' };
  function openGame(gid){ const L=d(); const g=GAMES[gid], sh=$('.sheet[data-sheet="game"]');
    const page=GAME_PAGES[gid];
    if(page){ const q=(person&&person.id)?('?id='+encodeURIComponent(person.id)):''; location.href=page+q; return; }

      <div class="pending" style="margin-top:0;margin-bottom:14px;background:rgba(243,205,132,.08);border-color:rgba(243,205,132,.3);color:var(--gold-hi)">${sv(I.play,0)} ${L.gameScoped}</div>
      <div class="btnrow"><button class="btn ghost" data-act="close">${L.cancel}</button><button class="btn primary" data-act="close">${L.playCta}</button></div>`;
