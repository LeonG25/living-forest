<style>
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ background:#04070e; }
  :root{
    --cream:#f4ecdb; --muted:#9db0cc; --dim:#6f83a3; --hair:#ffffff18; --panel:#ffffff0b;
    --gold:#f3cd84; --gold-hi:#ffe6ad; --cool:#7fb4d8; --cool-hi:#a9d2ee;
    --edit:#c9a2ff; --danger:#ff9a86;
  }
  body{ font-family:'Hanken Grotesk',system-ui,sans-serif; color:var(--cream); min-height:100dvh;
    background:radial-gradient(150% 100% at 50% -6%, #12233c 0%, #0a1526 44%, #04070e 100%);
    -webkit-user-select:none; user-select:none; }
  .serif{ font-family:'Newsreader',Georgia,serif; }
  [dir="rtl"] .serif, [dir="rtl"] .msg-body, [dir="rtl"] .compose textarea, [dir="rtl"] .n, [dir="rtl"] .who, [dir="rtl"] .nm{ font-family:'Frank Ruhl Libre','Newsreader',serif; }

  /* ===== the device : full viewport ===== */
  .device{ position:relative; width:100vw; height:100dvh; overflow:hidden; background:#04070e; }

  /* alive background (from the approved design) */
  .sky{ position:absolute; inset:-14%; z-index:0;
    background:
      radial-gradient(38% 28% at 20% 16%, rgba(86,214,196,.30), transparent 60%),
      radial-gradient(42% 32% at 84% 24%, rgba(150,120,236,.30), transparent 60%),
      radial-gradient(44% 34% at 74% 82%, rgba(236,110,200,.22), transparent 60%),
      radial-gradient(48% 40% at 24% 86%, rgba(255,207,126,.20), transparent 62%),
      radial-gradient(60% 50% at 50% 48%, rgba(95,200,236,.12), transparent 72%);
    animation:sky 20s ease-in-out infinite alternate; }
  @keyframes sky{ 0%{ transform:scale(1) translate(0,0); filter:hue-rotate(0deg); }
    100%{ transform:scale(1.14) translate(-3%,-2%); filter:hue-rotate(20deg); } }
  .glow{ position:absolute; inset-inline:0; top:44px; height:150px; z-index:0; pointer-events:none;
    background:radial-gradient(60% 100% at 50% 0%, rgba(243,205,132,.30), transparent 72%);
    filter:blur(14px); animation:breathe 7s ease-in-out infinite; }
  @keyframes breathe{ 0%,100%{ opacity:.5; } 50%{ opacity:.95; } }
  .veil{ position:absolute; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(120% 80% at 50% 26%, transparent 32%, rgba(4,7,14,.5) 100%),
      linear-gradient(180deg, rgba(4,7,14,.32), transparent 22%, transparent 58%, rgba(4,7,14,.7)); }
  .mote{ position:absolute; z-index:1; width:3px; height:3px; border-radius:50%; background:rgba(255,248,232,.85);
    box-shadow:0 0 8px 2px rgba(255,232,180,.5); animation:float linear infinite; }
  @keyframes float{ 0%{ transform:translateY(10px); opacity:0; } 12%{ opacity:.9; } 88%{ opacity:.9; } 100%{ transform:translateY(-150px); opacity:0; } }

  /* app chrome */
  .app{ position:absolute; inset:0; z-index:3; display:flex; flex-direction:column;
    width:100%; max-width:480px; margin:0 auto; }
  .topbar{ flex:0 0 auto; display:flex; align-items:center; gap:10px; padding:16px 16px 12px;
    padding-top:calc(16px + env(safe-area-inset-top));
    background:linear-gradient(to bottom, rgba(5,9,17,.86), rgba(5,9,17,.35) 70%, transparent); backdrop-filter:blur(7px); }
  .ibtn{ width:40px; height:40px; border-radius:12px; flex:0 0 auto; display:grid; place-items:center; cursor:pointer;
    border:1px solid var(--hair); background:rgba(10,20,34,.55); color:var(--cream); }
  .ibtn svg{ width:18px; height:18px; }
  .ttl{ flex:1; min-width:0; }
  .ttl .k{ font-family:'Azeret Mono',monospace; font-size:9px; letter-spacing:.22em; text-transform:uppercase; color:var(--muted); }
  .ttl .n{ font-family:'Newsreader',serif; font-size:22px; color:#fbf5e8; line-height:1.05; margin-top:1px; }
  .ttl.center{ text-align:center; }
  .writebtn{ display:inline-flex; align-items:center; gap:7px; padding:9px 13px; border-radius:99px; cursor:pointer; flex:0 0 auto;
    background:linear-gradient(180deg,var(--gold-hi),var(--gold)); color:#1a1206; border:none;
    font-family:'Hanken Grotesk',sans-serif; font-size:12.5px; font-weight:700; }
  .writebtn svg{ width:15px; height:15px; }

  .body{ flex:1; min-height:0; overflow-y:auto; scrollbar-width:none; padding:2px 0 22px; }
  .body::-webkit-scrollbar{ display:none; }

  /* ===== the list ===== */
  .row{ position:relative; display:flex; gap:12px; align-items:flex-start; padding:15px 18px; cursor:pointer;
    border-bottom:1px solid rgba(255,255,255,.05); }
  .row .dir{ flex:0 0 auto; width:22px; display:flex; flex-direction:column; align-items:center; gap:6px; padding-top:3px; }
  .row .dot{ width:9px; height:9px; border-radius:50%; }
  .row.unread .dot{ background:var(--gold); box-shadow:0 0 9px 2px rgba(243,205,132,.7); }
  .row .arrow{ color:var(--cool); }
  .row .arrow svg{ width:16px; height:16px; display:block; }
  [dir="rtl"] .row .arrow svg{ transform:scaleX(-1); }
  .row .rt{ flex:1; min-width:0; }
  .row .eyebrow{ display:flex; align-items:center; gap:8px; font-family:'Azeret Mono',monospace; font-size:9.5px;
    letter-spacing:.1em; text-transform:uppercase; }
  .row .eyebrow.in{ color:var(--dim); } .row .eyebrow.out{ color:rgba(127,180,216,.75); }
  .row .eyebrow .who{ font-family:'Newsreader',serif; font-size:16px; letter-spacing:0; text-transform:none; color:#eadfca; }
  .row .eyebrow.out .who{ color:#cfe0f2; }
  .row .prev{ font-size:13.5px; line-height:1.4; color:#cdbfa4; margin-top:4px;
    display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden; }
  .row .time{ flex:0 0 auto; font-family:'Azeret Mono',monospace; font-size:9.5px; color:var(--dim); padding-top:4px; }
  .row.unread .eyebrow .who{ color:#fff2d6; font-weight:600; }
  .row.unread .prev{ color:#f0e6d0; font-weight:600; }
  .row.incoming{ box-shadow:inset 3px 0 0 rgba(243,205,132,.55); }
  [dir="rtl"] .row.incoming{ box-shadow:inset -3px 0 0 rgba(243,205,132,.55); }
  .row.outgoing{ box-shadow:inset 3px 0 0 rgba(127,180,216,.4); background:rgba(9,17,29,.32); }
  [dir="rtl"] .row.outgoing{ box-shadow:inset -3px 0 0 rgba(127,180,216,.4); }

  /* empty state */
  .emptybox{ height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:16px; padding:30px; }
  .emptybox .env{ width:70px; height:70px; border-radius:20px; display:grid; place-items:center; color:var(--gold-hi);
    border:1px solid rgba(243,205,132,.28); background:rgba(243,205,132,.06); }
  .emptybox .env svg{ width:34px; height:34px; }
  .emptybox .t{ font-family:'Newsreader',serif; font-size:20px; color:#e9dcc2; }
  .emptybox .writebtn{ margin-top:4px; }

  /* ===== opened message ===== */
  .msg{ padding:20px 18px 0; }
  .msg .mhead{ display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  .msg .mhead .flame{ width:8px; height:8px; border-radius:50%; background:var(--gold); box-shadow:0 0 10px 2px rgba(243,205,132,.8); flex:0 0 auto; }
  .msg .mhead .from{ font-family:'Azeret Mono',monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); }
  .msg .mhead .from b{ font-family:'Newsreader',serif; font-size:16px; letter-spacing:0; text-transform:none; color:#eadfca; font-weight:400; }
  .msg .mhead .time{ margin-inline-start:auto; font-family:'Azeret Mono',monospace; font-size:10px; color:var(--dim); }
  .fwd{ display:inline-flex; align-items:center; gap:7px; margin-bottom:13px; padding:6px 11px; border-radius:99px;
    font-family:'Azeret Mono',monospace; font-size:9px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--cool-hi); background:rgba(127,180,216,.12); border:1px solid rgba(127,180,216,.3); }
  .fwd svg{ width:13px; height:13px; }
  .msg-body{ font-family:'Newsreader',serif; font-weight:300; font-size:22px; line-height:1.5; color:#f7edda; white-space:pre-wrap; word-wrap:break-word; }
  .inlink{ display:inline-flex; align-items:center; gap:6px; margin-top:14px; padding:9px 13px; border-radius:12px; cursor:pointer;
    background:rgba(243,205,132,.08); border:1px solid rgba(243,205,132,.32); color:var(--gold-hi);
    font-family:'Hanken Grotesk',sans-serif; font-size:13.5px; font-weight:600; text-decoration:none; }
  .inlink svg{ width:15px; height:15px; }
  .inlink .lchev{ margin-inline-start:2px; opacity:.7; }
  [dir="rtl"] .inlink .lchev svg{ transform:scaleX(-1); }
  .transbox{ margin-top:16px; padding:13px 14px; border-radius:14px;
    background:rgba(127,180,216,.07); border:1px solid rgba(127,180,216,.24); }
  .transbox .tcap{ font-family:'Azeret Mono',monospace; font-size:9px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--cool); display:flex; align-items:center; gap:7px; margin-bottom:8px; }
  .transbox .tcap::before{ content:""; width:5px; height:5px; border-radius:50%; background:var(--cool); box-shadow:0 0 7px 1px var(--cool); }
  .transbox .ttext{ font-family:'Newsreader',serif; font-weight:300; font-size:19px; line-height:1.5; color:#e4eef8; white-space:pre-wrap; }
  .translate{ margin-top:18px; display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:10px; cursor:pointer;
    color:var(--cool); background:rgba(127,180,216,.08); border:1px solid rgba(127,180,216,.26);
    font-family:'Azeret Mono',monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase; }
  .translate svg{ width:14px; height:14px; }
  .aswritten{ margin-top:12px; font-family:'Azeret Mono',monospace; font-size:9px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--dim); display:flex; align-items:center; gap:7px; }
  .aswritten::before{ content:""; width:5px; height:5px; border-radius:50%; background:var(--gold); box-shadow:0 0 7px 1px var(--gold); }

  .actionbar{ margin-top:auto; display:flex; gap:8px; padding:12px 16px calc(16px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, rgba(5,9,17,.9), transparent); }
  .act{ flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; padding:11px 4px; border-radius:14px; cursor:pointer;
    border:1px solid var(--hair); background:rgba(10,20,34,.5); color:var(--cream);
    font-family:'Hanken Grotesk',sans-serif; font-size:11.5px; }
  .act svg{ width:18px; height:18px; }
  .act.del{ color:var(--danger); border-color:rgba(255,154,134,.28); }

  /* ===== delete confirm ===== */
  .dim{ position:absolute; inset:0; z-index:5; background:rgba(4,7,14,.6); backdrop-filter:blur(2px); }
  .confirm{ position:absolute; z-index:6; inset-inline:0; bottom:0; padding:8px 20px calc(22px + env(safe-area-inset-bottom));
    width:100%; max-width:480px; margin:0 auto;
    background:linear-gradient(180deg,#141122,#0a0812); border-top:1px solid rgba(255,154,134,.3);
    border-radius:22px 22px 0 0; box-shadow:0 -22px 60px -28px #000; }
  .confirm .grip{ width:40px; height:4px; border-radius:99px; background:rgba(255,255,255,.2); margin:6px auto 16px; }
  .confirm .ct{ font-family:'Newsreader',serif; font-size:19px; line-height:1.4; color:#f6ece0; text-align:center; }
  .confirm .cbtns{ display:flex; gap:10px; margin-top:20px; }
  .cbtn{ flex:1; padding:14px; border-radius:13px; cursor:pointer; border:1px solid transparent;
    font-family:'Hanken Grotesk',sans-serif; font-size:14px; font-weight:600; }
  .cbtn.keep{ background:transparent; border-color:var(--hair); color:var(--cream); }
  .cbtn.del{ background:linear-gradient(180deg,#ffb2a1,var(--danger)); color:#2a0f0a; }

  /* ===== compose ===== */
  .compose{ padding:16px 18px; display:flex; flex-direction:column; min-height:100%; }
  .to-field{ margin-bottom:14px; }
  .to-field .lbl{ font-family:'Azeret Mono',monospace; font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; display:block; }
  .to-chip{ display:inline-flex; align-items:center; gap:9px; padding:8px 10px 8px 8px; border-radius:99px;
    background:rgba(243,205,132,.1); border:1px solid rgba(243,205,132,.34); }
  .to-chip .av{ width:26px; height:26px; border-radius:50%; overflow:hidden; flex:0 0 auto; }
  .to-chip .av svg,.to-chip .av img{ width:100%; height:100%; display:block; object-fit:cover; }
  .to-chip .nm{ font-family:'Newsreader',serif; font-size:15px; color:#fbf5e8; }
  .to-chip .x{ width:16px; height:16px; color:var(--muted); cursor:pointer; }
  .picker-hint{ font-size:11.5px; color:var(--muted); margin:2px 0 10px; display:flex; align-items:center; gap:7px; }
  .picker-hint svg{ width:14px; height:14px; color:var(--cool); flex:0 0 auto; }
  .plist{ display:flex; flex-direction:column; gap:2px; }
  .prow{ display:flex; align-items:center; gap:12px; padding:11px 8px; border-radius:12px; cursor:pointer; }
  .prow.on{ background:rgba(243,205,132,.09); }
  .prow .av{ width:38px; height:38px; border-radius:50%; overflow:hidden; flex:0 0 auto; border:1px solid var(--hair); }
  .prow .av svg,.prow .av img{ width:100%; height:100%; display:block; object-fit:cover; }
  .prow .nm{ flex:1; font-family:'Newsreader',serif; font-size:16px; color:#eadfca; }
  .prow .radio{ width:20px; height:20px; border-radius:50%; border:1.5px solid var(--hair); flex:0 0 auto; display:grid; place-items:center; }
  .prow.on .radio{ border-color:var(--gold); }
  .prow.on .radio::after{ content:""; width:11px; height:11px; border-radius:50%; background:var(--gold); box-shadow:0 0 8px 1px var(--gold); }
  .compose textarea{ margin-top:14px; flex:1; min-height:120px; width:100%; resize:none;
    background:rgba(8,16,28,.55); border:1px solid var(--hair); border-radius:14px; padding:14px;
    color:#f7edda; font-family:'Newsreader',serif; font-weight:300; font-size:18px; line-height:1.5; }
  .compose textarea:focus{ outline:none; border-color:rgba(243,205,132,.5); }
  .sendbar{ margin-top:12px; display:flex; }
  .sendbtn{ flex:1; padding:15px; border-radius:14px; cursor:pointer; border:none;
    background:linear-gradient(180deg,var(--gold-hi),var(--gold)); color:#1a1206;
    font-family:'Hanken Grotesk',sans-serif; font-size:15px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:9px; }
  .sendbtn:disabled{ opacity:.55; cursor:default; }
  .sendbtn svg{ width:17px; height:17px; }
  .refuse{ margin-top:10px; text-align:center; font-size:12.5px; color:var(--danger); min-height:16px; }

  .nobody{ height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:14px; padding:34px; }
  .nobody .env{ width:60px; height:60px; border-radius:18px; display:grid; place-items:center; color:var(--dim);
    border:1px dashed var(--hair); background:rgba(255,255,255,.02); }
  .nobody .env svg{ width:28px; height:28px; }
  .nobody .t{ font-family:'Newsreader',serif; font-size:17px; line-height:1.5; color:var(--muted); max-width:230px; }

  .loadingbox{ height:100%; display:flex; align-items:center; justify-content:center; color:var(--muted);
    font-family:'Azeret Mono',monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; }

  .toast{ position:fixed; z-index:80; left:50%; transform:translate(-50%,20px); bottom:calc(22px + env(safe-area-inset-bottom));
    background:rgba(12,22,36,.96); border:1px solid var(--hair); border-radius:12px; padding:11px 16px; color:var(--cream);
    font-size:13px; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; }
  .toast.show{ opacity:1; transform:translate(-50%,0); }

  @media (prefers-reduced-motion: reduce){ .sky,.glow,.mote{ animation:none !important; } }
</style>

    reply:'<path d="M9 7L4 12l5 5"/><path d="M4 12h10a6 6 0 016 6v0"/>',
    forward:'<path d="M15 7l5 5-5 5"/><path d="M20 12H10a6 6 0 00-6 6v0"/>',
    trash:'<path d="M4 7h16M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2M6 7l1 12a1 1 0 001 1h8a1 1 0 001-1l1-12"/>',
    leaf:'<path d="M4 20c0-9 7-15 16-15 0 9-6 15-15 15z"/><path d="M4 20c3-4 7-6 11-8"/>',
    chev:'<path d="M9 6l6 6-6 6"/>',
    translate:'<path d="M4 5h9M8 3v2M6 5c0 5-2 8-4 9M5 9c0 3 2 5 5 6"/><path d="M13 19l4-9 4 9M14.5 15h5"/>',
    send:'<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>',
    sentarrow:'<path d="M5 12h13M12 5l7 7-7 7"/>',
    people:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 6.5a3 3 0 010 5.6M21 20c0-2.4-1.4-4.5-3.5-5.4"/>',
    x:'<path d="M6 6l12 12M18 6L6 18"/>'
  };
  const sv=(p,w)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w||1.6}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;

  /* face-avatar art (procedural, gender-neutral) — a fallback until a real portrait loads */
  const SK=['#e6c49b','#d9b083','#e0b98d','#eac6a0','#dcb58c'];
  const HR=['#7a5c40','#3a3a3a','#4a3a2a','#b8b0a4','#5a4030'];
  const BG=['#3a2a1e','#2a3446','#243449','#2c2a1e','#33283a'];
  function h32(s){ let h=0; s=String(s||''); for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return Math.abs(h); }
  function faceSVG(seed){ const h=h32(seed), sk=SK[h%5], hr=HR[(h>>3)%5], bg=BG[(h>>5)%5], g=(h>>7)%4===0;
    return `<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="${bg}"/><ellipse cx="50" cy="47" rx="23" ry="26" fill="${sk}"/><path d="M50 96 Q50 70 27 66 Q31 42 50 42 Q69 42 73 66 Q50 70 50 96Z" fill="${hr}"/><path d="M27 44 Q31 23 50 23 Q69 23 73 44 Q61 33 50 33 Q39 33 27 44Z" fill="${g?'#cfc7bb':hr}"/></svg>`; }

  /* ---------- state ---------- */
  const state={ lang:'en', view:'list' };
  let user=null, me=null;               // me = my person id
  let messages=[], byId={}, nameMap={}, peopleList=null;
  let cur=null;                         // opened message
  let compose=null;                     // {recipient, recipientLabel, body, forwardedFrom, sending}
  const urlCache={};
  const d=()=>L[state.lang];

  /* ---------- names ---------- */
  async function loadNames(ids){
    ids=[...new Set((ids||[]).filter(Boolean))].filter(id=>nameMap[id]===undefined);
    if(!ids.length) return;
    try{
      const {data}=await sb.from('person_facts').select('person_id,field,lang,value,status')
        .in('person_id',ids).in('field',['called','given','family','maiden']).eq('status','published');
      const by=window.LFName?LFName.byPerson(data||[]):{};
      ids.forEach(id=>{ const facts=by[id]||[]; nameMap[id]=(window.LFName&&LFName.label(facts,state.lang))||''; });
    }catch(e){ ids.forEach(id=>{ if(nameMap[id]===undefined) nameMap[id]=''; }); }
  }
  const nmeOf=id=>nameMap[id]||d().someone;

  /* ---------- portraits (real face when we have one, procedural otherwise) ---------- */
  async function signed(path){ if(!path) return ''; if(urlCache[path]!==undefined) return urlCache[path];
    try{ const r=await sb.storage.from('family').createSignedUrl(path,3600,LFDB.img(path,200));
      const u=(r.data&&r.data.signedUrl)||''; urlCache[path]=u; return u; }
    catch(e){ urlCache[path]=''; return ''; } }
  function hydrateFaces(){
    $$('[data-fp]').forEach(async el=>{ const path=el.getAttribute('data-fp'); el.removeAttribute('data-fp');
      const u=await signed(path); if(u){ const img=new Image(); img.src=u; img.alt=''; el.innerHTML=''; el.appendChild(img); } });
  }
  const avatar=(id,cls)=>`<span class="${cls||'av'}" data-fp="portraits/${esc(id)}.jpg">${faceSVG(id)}</span>`;

  /* ---------- time ---------- */
  function timeLabel(ts){ const t=new Date(ts).getTime(), now=Date.now(), diff=now-t, Ld=d();
    if(diff<60000) return Ld.now;
    if(diff<3600000) return Math.round(diff/60000)+' '+Ld.min;
    const day=x=>{ const z=new Date(x); z.setHours(0,0,0,0); return z.getTime(); };
    const dd=Math.round((day(now)-day(t))/86400000);
    if(dd<=0) return Math.round(diff/3600000)+' '+Ld.hr;
    if(dd===1) return Ld.yesterday;
    const loc=state.lang==='he'?'he-IL':(state.lang==='ru'?'ru-RU':'en-GB');
    try{ return new Date(t).toLocaleDateString(loc,{day:'numeric',month:'short'}); }catch(e){ return ''; }
  }

  /* ---------- load ---------- */
  async function loadMessages(){
    messages=[]; byId={};
    try{
      const {data}=await sb.from('messages')
        .select('id,sender_person,recipient_person,body,forwarded_from,sent_at,read_at,hidden_by_sender,hidden_by_recipient');
      messages=(data||[]).slice();
    }catch(e){ messages=[]; }
    messages.forEach(m=>{ byId[m.id]=m; });
    const ids=[];
    messages.forEach(m=>{ ids.push(m.sender_person===me?m.recipient_person:m.sender_person); });
    await loadNames(ids);
  }

  /* ---------- list ---------- */
  function topbarList(){ const Ld=d();
    return `<div class="topbar">
      <div class="ttl"><div class="k">${esc(Ld.native)}</div><div class="n">${esc(Ld.title)}</div></div>
      <button class="writebtn" data-act="write">${sv(I.pencil,1.7)} ${esc(Ld.write)}</button>
    </div>`; }

  function listView(){ const Ld=d();
    if(!messages.length){
      return topbarList()+`<div class="body"><div class="emptybox">
        <div class="env">${sv(I.env,1.4)}</div>
        <div class="t">${esc(Ld.empty)}</div>
        <button class="writebtn" data-act="write">${sv(I.pencil,1.7)} ${esc(Ld.write)}</button>
      </div></div>`;
    }
    const t=x=>new Date(x.sent_at||0).getTime();
    const unread=messages.filter(m=>m.recipient_person===me && !m.read_at).sort((a,b)=>t(b)-t(a));
    const rest=messages.filter(m=>!(m.recipient_person===me && !m.read_at)).sort((a,b)=>t(b)-t(a));
    const ordered=unread.concat(rest);
    const rowHTML=ordered.map(m=>{
      const inc=m.recipient_person===me;
      const who=nmeOf(inc?m.sender_person:m.recipient_person);
      const isUnread=inc && !m.read_at;
      const eyebrow=inc
        ? `<span class="eyebrow in">${esc(Ld.fromLine)} <span class="who">${esc(who)}</span></span>`
        : `<span class="eyebrow out"><span class="arrow">${sv(I.sentarrow,2)}</span>${esc(Ld.toLine)} <span class="who">${esc(who)}</span></span>`;
      return `<div class="row ${inc?'incoming':'outgoing'} ${isUnread?'unread':''}" data-open="${esc(m.id)}">
        <div class="dir">${inc?'<span class="dot"></span>':''}</div>
        <div class="rt">${eyebrow}<div class="prev">${esc(m.body)}</div></div>
        <div class="time">${esc(timeLabel(m.sent_at))}</div>
      </div>`;
    }).join('');
    return topbarList()+`<div class="body">${rowHTML}</div>`;
  }

  /* ---------- opened message ---------- */
  /* a link is tappable ONLY if it stays inside the forest */
  const APP_PAGES=/^(home-real|person-real|place-real|moment-real|crowd-real|timeline-real|search-real|tree-real|contribute-real|curators-real|review-real|journal-real|reel-real|clearing-real|mail-real|game-missing-voice|game-tangled-thread|game-who-is-who|game-what-happened-next|game-where-was-this|game-order-of-things|index)\.html$/;
  function appLink(token){
    try{
      const u=new URL(token, location.href);
      if(u.origin!==location.origin) return null;
      const page=(u.pathname.split('/').pop()||'index.html');
      if(page==='' || APP_PAGES.test(page)) return u.pathname.replace(/^\//,'')+u.search+u.hash || 'index.html';
      return null;
    }catch(e){ return null; }
  }
  function findAppLinks(body){
    const out=[]; const re=/(https?:\/\/[^\s]+|(?:[A-Za-z0-9_-]+)\.html[^\s]*)/g; let m;
    while((m=re.exec(String(body||'')))){ const rel=appLink(m[0]); if(rel && !out.some(o=>o.href===rel)) out.push({raw:m[0],href:rel}); }
    return out;
  }

  function topbarBack(titleK,titleN){ const Ld=d();
    return `<div class="topbar">
      <button class="ibtn" data-act="back" aria-label="Back">${sv(state.lang==='he'?'<path d="M9 18l6-6-6-6"/>':I.back,1.7)}</button>
      <div class="ttl center"><div class="k">${esc(titleK)}</div><div class="n">${esc(titleN)}</div></div>
      <span style="width:40px;flex:0 0 auto"></span>
    </div>`; }

  function openedView(){ const Ld=d(), m=cur; if(!m) return listView();
    const inc=m.recipient_person===me;
    const who=nmeOf(inc?m.sender_person:m.recipient_person);
    let fwd='';
    if(m.forwarded_from){
      const src=byId[m.forwarded_from];
      const orig=src?nmeOf(src.sender_person):null;
      fwd=`<div class="fwd">${sv(I.forward,1.7)} ${esc(Ld.forwarded)}${orig?(' · '+esc(orig)):''}</div>`;
    }
    const links=findAppLinks(m.body).map(l=>`<a class="inlink" data-link="${esc(l.href)}">${sv(I.leaf,1.5)} ${esc(Ld.openLink)}<span class="lchev">${sv(I.chev,2)}</span></a>`).join('');
    return topbarBack(inc?Ld.fromLine:Ld.toLine, who)
      +`<div class="body"><div class="msg">
        <div class="mhead"><span class="flame"></span>
          <span class="from">${esc(inc?Ld.fromLine:Ld.toLine)} <b>${esc(who)}</b></span>
          <span class="time">${esc(timeLabel(m.sent_at))}</span></div>
        ${fwd}
        <div class="msg-body">${esc(m.body)}</div>
        ${links}
        <div id="transArea"></div>
        <div class="translate" data-act="translate">${sv(I.translate,1.5)} ${esc(Ld.translate)}</div>
        <div class="aswritten">${esc(Ld.asWritten)}</div>
        <span id="readMark" style="display:block;height:1px"></span>
      </div></div>
      <div class="actionbar">
        <button class="act" data-act="reply">${sv(I.reply,1.6)}${esc(Ld.reply)}</button>
        <button class="act" data-act="forward">${sv(I.forward,1.6)}${esc(Ld.forward)}</button>
        <button class="act del" data-act="delete">${sv(I.trash,1.6)}${esc(Ld.del)}</button>
      </div>`;
  }

  /* ---------- compose ---------- */
  async function loadPeopleList(){
    if(peopleList) return peopleList;
    let ids=[];
    try{ const {data}=await sb.rpc('mailbox_people'); ids=(data||[]).map(r=>r.id||r).filter(Boolean); }catch(e){ ids=[]; }
    await loadNames(ids);
    peopleList=ids.map(id=>({id, label:nmeOf(id)}))
      .filter(p=>p.label && p.label!==d().someone)
      .sort((a,b)=>a.label.localeCompare(b.label));
    return peopleList;
  }
  function composeView(){ const Ld=d();
    if(peopleList && !peopleList.length && !compose.recipient){
      return topbarBack(Ld.native,Ld.writeTitle)+`<div class="body"><div class="nobody">
        <div class="env">${sv(I.people,1.4)}</div><div class="t">${esc(Ld.nobody)}</div>
      </div></div>`;
    }
    let toBlock, picker='';
    if(compose.recipient){
      toBlock=`<span class="to-chip">${avatar(compose.recipient)}<span class="nm">${esc(compose.recipientLabel||nmeOf(compose.recipient))}</span><span class="x" data-act="clear-to">${sv(I.x,2)}</span></span>`;
    } else {
      const rows=(peopleList||[]).map(p=>`<div class="prow" data-pick="${esc(p.id)}" data-label="${esc(p.label)}">
        ${avatar(p.id)}<span class="nm">${esc(p.label)}</span><span class="radio"></span></div>`).join('');
      toBlock=`<div class="picker-hint" style="margin:0">${sv(I.people,1.6)} ${esc(Ld.pickerHint)}</div>`;
      picker=`<div class="plist">${rows}</div>`;
    }
    return topbarBack(Ld.native,Ld.writeTitle)+`<div class="body"><div class="compose">
      <div class="to-field"><span class="lbl">${esc(Ld.to)} · ${esc(Ld.oneOnly)}</span>${toBlock}</div>
      ${picker}
      <textarea id="cBody" ${compose.sending?'disabled':''}>${esc(compose.body||'')}</textarea>
      <div class="sendbar"><button class="sendbtn" data-act="do-send" ${(!compose.recipient||compose.sending)?'disabled':''}>${sv(I.send,1.7)} ${esc(compose.sending?Ld.sending:Ld.send)}</button></div>
      <div class="refuse" id="cRefuse"></div>
    </div></div>`;
  }

  /* ---------- render ---------- */
  function render(){ const Ld=d();
    document.documentElement.lang=state.lang; document.documentElement.dir=Ld.dir;
    $('#app').setAttribute('dir',Ld.dir);
    let html;
    if(state.view==='open') html=openedView();
    else if(state.view==='write') html=composeView();
    else html=listView();
    $('#app').innerHTML=html;
    wire(); hydrateFaces();
    if(state.view==='open') armRead();
  }

  /* ---------- read state : mark read only when fully shown ---------- */
  function armRead(){ const m=cur; if(!m||m.recipient_person!==me||m.read_at) return;
    const mark=document.getElementById('readMark'); if(!mark) return;
    const done=async()=>{ if(m.read_at) return; m.read_at=new Date().toISOString();
      try{ await sb.rpc('mark_message_read',{msg:m.id}); }catch(e){}
      try{ if(window.LFNav&&LFNav.refresh) LFNav.refresh(); }catch(e){} };
    try{ const io=new IntersectionObserver((ents)=>{ ents.forEach(en=>{ if(en.isIntersecting){ io.disconnect(); done(); } }); },{root:document.querySelector('.body')});
      io.observe(mark);
    }catch(e){ done(); }
  }

  /* ---------- translate ---------- */
  function cleanTr(v,lg){ if(v==null) return ''; let raw=String(v).replace(/[\u00a0\ufeff]/g,' ').trim(); if(!raw) return '';
    if(/[\u0600-\u06FF\u0750-\u077F\u0370-\u03FF\u0530-\u058F\u4E00-\u9FFF\u3040-\u30FF\u0E00-\u0E7F\u0900-\u097F]/.test(raw)) return '';
    if(lg==='he' && /[\u0400-\u04FF]/.test(raw)) return '';
    if(lg==='ru' && /[\u0590-\u05FF]/.test(raw)) return '';
    if(lg==='en' && /[\u0400-\u04FF\u0590-\u05FF]/.test(raw)) return '';
    if(/\b(as an ai|i (can('?t| ?not)|could not|am unable)|cannot translate)\b/i.test(raw)) return '';
    return raw; }
  let translating=false;
  async function doTranslate(){ const m=cur, Ld=d(); if(!m||translating) return;
    const area=document.getElementById('transArea'); if(!area) return;
    if(area.dataset.shown==='1'){ area.innerHTML=''; area.dataset.shown=''; const btn=$('[data-act="translate"]'); if(btn) btn.innerHTML=sv(I.translate,1.5)+' '+esc(Ld.translate); return; }
    translating=true; area.innerHTML=`<div class="transbox"><div class="ttext">${esc(Ld.sending)}</div></div>`;
    let out='';
    try{ const {data,error}=await sb.functions.invoke('translate',
           {body:{target_lang:state.lang,items:[{kind:'message',ref:String(m.id),text:m.body}]}});
      if(!error && data && data.results && data.results[0]) out=data.results[0].text||''; }
    catch(e){ out=''; }
    out=cleanTr(out,state.lang);
    translating=false;
    if(!out){ area.innerHTML=`<div class="transbox"><div class="ttext" style="color:var(--danger)">${esc(Ld.trFail)}</div></div>`; area.dataset.shown=''; return; }
    area.innerHTML=`<div class="transbox"><div class="tcap">${esc(Ld.translated)}</div><div class="ttext">${esc(out)}</div></div>`;
    area.dataset.shown='1';
    const btn=$('[data-act="translate"]'); if(btn) btn.innerHTML=sv(I.translate,1.5)+' '+esc(Ld.showOriginal);
  }

  /* ---------- delete confirm ---------- */
  function openDelete(){ const Ld=d(); closeOverlays();
    const o=document.createElement('div'); o.id='delOv';
    o.innerHTML=`<div class="dim" data-act="del-cancel"></div>
      <div class="confirm"><div class="grip"></div>
        <div class="ct">${esc(Ld.delConfirm)}</div>
        <div class="cbtns">
          <button class="cbtn keep" data-act="del-cancel">${esc(Ld.cancel)}</button>
          <button class="cbtn del" data-act="del-confirm">${esc(Ld.del)}</button>
        </div></div>`;
    $('#dev').appendChild(o);
    o.addEventListener('click',e=>{ const a=e.target.closest('[data-act]'); if(!a) return;
      if(a.dataset.act==='del-cancel') closeOverlays();
      else if(a.dataset.act==='del-confirm') doDelete(); });
  }
  function closeOverlays(){ const o=document.getElementById('delOv'); if(o) o.remove(); }
  async function doDelete(){ const m=cur; closeOverlays(); if(!m) return;
    try{ await sb.rpc('hide_message',{msg:m.id}); }catch(e){}
    cur=null; state.view='list'; await loadMessages(); render();
    try{ if(window.LFNav&&LFNav.refresh) LFNav.refresh(); }catch(e){}
  }

  /* ---------- send ---------- */
  async function doSend(){ const Ld=d();
    const ta=document.getElementById('cBody'); if(ta) compose.body=ta.value;
    const body=String(compose.body||'').trim();
    const refuse=document.getElementById('cRefuse');
    if(!compose.recipient || !body || compose.sending) return;
    compose.sending=true; render();
    const row={ sender_person:me, recipient_person:compose.recipient, body:body };
    if(compose.forwardedFrom) row.forwarded_from=compose.forwardedFrom;
    let ok=false;
    try{ const {error}=await sb.from('messages').insert(row); ok=!error; }catch(e){ ok=false; }
    if(!ok){ compose.sending=false; render(); const r=document.getElementById('cRefuse'); if(r) r.textContent=Ld.sendFail; return; }
    compose=null; cur=null; state.view='list'; await loadMessages(); render();
    try{ if(window.LFNav&&LFNav.refresh) LFNav.refresh(); }catch(e){}
  }

  /* ---------- open a compose ---------- */
  async function startWrite(opts){ opts=opts||{};
    compose={ recipient:opts.recipient||null, recipientLabel:opts.recipientLabel||null,
      body:opts.body||'', forwardedFrom:opts.forwardedFrom||null, sending:false };
    state.view='write'; peopleList=null;
    if(!compose.recipient){ render(); await loadPeopleList(); if(state.view==='write') render(); }
    else render();
  }

  /* ---------- interactions ---------- */
  window.__lfClose=function(){
    if(document.getElementById('delOv')){ closeOverlays(); return true; }
    if(state.view!=='list'){ compose=null; cur=null; state.view='list'; render(); return true; }
    return false;
  };
  function wire(){
    const app=$('#app');
    app.onclick=async function(e){
      const openRow=e.target.closest('[data-open]');
      if(openRow){ cur=byId[openRow.getAttribute('data-open')]; if(cur){ state.view='open'; render(); } return; }
      const link=e.target.closest('[data-link]');
      if(link){ location.href=link.getAttribute('data-link'); return; }
      const pick=e.target.closest('[data-pick]');
      if(pick){ compose.recipient=pick.getAttribute('data-pick'); compose.recipientLabel=pick.getAttribute('data-label');
        const ta=document.getElementById('cBody'); if(ta) compose.body=ta.value; render(); return; }
      const a=e.target.closest('[data-act]'); if(!a) return; const act=a.dataset.act;
      if(act==='write'){ startWrite(); }
      else if(act==='back'){ window.__lfClose(); }
      else if(act==='translate'){ doTranslate(); }
      else if(act==='reply'){ const m=cur; if(m){ const other=m.recipient_person===me?m.sender_person:m.recipient_person;
        startWrite({recipient:other, recipientLabel:nmeOf(other)}); } }
      else if(act==='forward'){ const m=cur; if(m){ startWrite({body:m.body, forwardedFrom:m.id}); } }
      else if(act==='delete'){ openDelete(); }
      else if(act==='clear-to'){ const ta=document.getElementById('cBody'); if(ta) compose.body=ta.value;
        compose.recipient=null; compose.recipientLabel=null; render(); }
      else if(act==='do-send'){ doSend(); }
    };
    const ta=document.getElementById('cBody');
    if(ta) ta.addEventListener('input',()=>{ if(compose) compose.body=ta.value; });
  }

  /* ---------- toast ---------- */
  function toast(msg){ let el=document.querySelector('.toast'); if(!el){ el=document.createElement('div'); el.className='toast'; document.body.appendChild(el); }
    el.textContent=msg; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),2200); }

  /* ---------- sign-in gate ---------- */
  function showGate(){ const Ld=d();
    const g=document.createElement('div'); g.id='gate';
    g.style.cssText='position:absolute;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(4,7,14,.86);backdrop-filter:blur(6px)';
    g.innerHTML=`<div style="width:100%;max-width:320px;background:linear-gradient(180deg,#0f1e33,#081120);border:1px solid var(--hair);border-radius:20px;padding:22px">
      <div class="serif" style="font-size:22px;color:#fbf5e8;margin-bottom:12px">${esc(Ld.title)}</div>
      <input id="gEmail" type="email" placeholder="you@example.com" style="width:100%;margin-bottom:10px;background:rgba(6,14,26,.7);border:1px solid var(--hair);border-radius:12px;padding:12px;color:var(--cream);font-family:inherit;font-size:14px">
      <input id="gPass" type="password" placeholder="••••••••" style="width:100%;margin-bottom:12px;background:rgba(6,14,26,.7);border:1px solid var(--hair);border-radius:12px;padding:12px;color:var(--cream);font-family:inherit;font-size:14px">
      <button id="gBtn" style="width:100%;padding:14px;border-radius:13px;border:none;cursor:pointer;font-weight:600;font-size:14px;background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#1a1206">${esc(Ld.title)}</button>
      <div id="gErr" style="color:#ff9a8a;font-size:12px;min-height:16px;margin-top:8px"></div></div>`;
    $('#dev').appendChild(g);
    $('#gBtn').onclick=async()=>{ const {error}=await sb.auth.signInWithPassword({email:$('#gEmail').value.trim(),password:$('#gPass').value}); if(error){ $('#gErr').textContent=error.message; return; } g.remove(); boot(); };
  }

  function showAnchorNotice(){ const Ld=d();
    $('#app').innerHTML=topbarList().replace('data-act="write"','data-act="write" style="display:none"')
      +`<div class="body"><div class="nobody">
        <div class="env">${sv(I.people,1.4)}</div>
        <div class="t">${esc(Ld.anchorFirst)}</div>
        <a class="writebtn" href="tree-real.html?choose=1" style="text-decoration:none">${esc(Ld.findMe)}</a>
      </div></div>`;
  }

  async function boot(){
    const {data:{session}}=await sb.auth.getSession();
    let stored=null; try{ stored=localStorage.getItem('lf_lang'); }catch(e){}
    if(stored&&L[stored]) state.lang=stored;
    else { const dl=(navigator.language||'en').slice(0,2); if(L[dl]) state.lang=dl; }
    if(!session){ render(); showGate(); return; }
    user=session.user;
    $('#app').innerHTML=topbarList()+`<div class="body"><div class="loadingbox">${esc(d().loading)}</div></div>`;
    try{ const r=await sb.rpc('my_person'); me=r.data||null; }catch(e){ me=null; }
    if(!me){ showAnchorNotice(); return; }
    await loadMessages(); render();
  }
  boot();
})();
</script>
